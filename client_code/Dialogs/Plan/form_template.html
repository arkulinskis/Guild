<div class="ui qb plan-dlg">
  <anvil-component type="Label" name="heading" prop:role='["dlg-h"]' prop:text="What are you studying for?"></anvil-component>
  <p class="muted small plan-lead">Pick a track and the learning path follows it. Add a date to get a daily pace and a readiness bar.</p>
  <div class="ui-stack">
    <div class="plan-tracks" role="group" aria-label="Tracks">
      <button type="button" class="plan-track" data-track="joining" anvil:name="tr_joining" anvil:on-dom:click="self.track_click"><strong anvil:dom-node="t_joining"></strong><span class="who" anvil:dom-node="w_joining"></span><span class="n" anvil:dom-node="n_joining"></span></button>
      <button type="button" class="plan-track" data-track="officer" anvil:name="tr_officer" anvil:on-dom:click="self.track_click"><strong anvil:dom-node="t_officer"></strong><span class="who" anvil:dom-node="w_officer"></span><span class="n" anvil:dom-node="n_officer"></span></button>
      <button type="button" class="plan-track" data-track="policy" anvil:name="tr_policy" anvil:on-dom:click="self.track_click"><strong anvil:dom-node="t_policy"></strong><span class="who" anvil:dom-node="w_policy"></span><span class="n" anvil:dom-node="n_policy"></span></button>
      <button type="button" class="plan-track" data-track="history" anvil:name="tr_history" anvil:on-dom:click="self.track_click"><strong anvil:dom-node="t_history"></strong><span class="who" anvil:dom-node="w_history"></span><span class="n" anvil:dom-node="n_history"></span></button>
      <button type="button" class="plan-track" data-track="all" anvil:name="tr_all" anvil:on-dom:click="self.track_click"><strong anvil:dom-node="t_all"></strong><span class="who" anvil:dom-node="w_all"></span><span class="n" anvil:dom-node="n_all"></span></button>
    </div>

    <div class="plan-when">
      <label class="ui-field"><span>Target date <span class="muted">(optional)</span></span>
        <anvil-component type="TextBox" name="date_box"></anvil-component>
      </label>
      <p class="ui-hint">From tomorrow up to two years out. Leave it empty to study at your own pace.</p>
      <div anvil:name="label_part">
        <p class="plan-for" id="plan-for">The date is for</p>
        <div class="plan-labels" role="group" aria-labelledby="plan-for">
          <button type="button" class="plan-chip" data-l="BMQ start" anvil:name="l_bmq" anvil:on-dom:click="self.label_click">BMQ start</button>
          <button type="button" class="plan-chip" data-l="Recruiting interview" anvil:name="l_interview" anvil:on-dom:click="self.label_click">Recruiting interview</button>
          <button type="button" class="plan-chip" data-l="Course" anvil:name="l_course" anvil:on-dom:click="self.label_click">Course</button>
          <button type="button" class="plan-chip" data-l="Exam" anvil:name="l_exam" anvil:on-dom:click="self.label_click">Exam</button>
          <button type="button" class="plan-chip" data-l="Own goal" anvil:name="l_own" anvil:on-dom:click="self.label_click">Own goal</button>
        </div>
      </div>
    </div>

    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save my plan" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>
