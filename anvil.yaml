    \ if (!el || !root.contains(el) || !el.dataset.action) return;\n      var a = el.dataset.action;\n      if (a === 'start')\
    \ start(data.cards || []);\n      else if (a === 'reveal') reveal();\n      else if (a === 'rate') rate(el.dataset.knew\
    \ === '1');\n      else if (a === 'stop') { if (S.ratings.length) { S.queue = []; finish(); } else renderIntro(); }\n\
    \      else if (a === 'again') start(S.still);\n      else if (a === 'back') emit('back', {});\n      else if (a === 'all')\
    \ {\n        el.disabled = true; el.innerHTML = '<span class=\"spin\"></span>';\n        emit('load', { scope: 'all' }).then(function\
