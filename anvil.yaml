    .qb-cur .crd .n { color: var(--qb-muted); font-size: .85rem; padding-top: 2px; }
    .qb-cur .crd .q { font-weight: 600; overflow-wrap: anywhere; }
    .qb-cur .crd .a { overflow-wrap: anywhere; }
