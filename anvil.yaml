  title: CAF Guide
name: CAF Guide
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=72d156b96c\"></script>\n\n<!--\n  CAF GUIDE — SHARED THEME + CORE HELPERS\n\
    \  Goes into: Anvil IDE → Native Libraries (tools/sync_to_anvil.py does this for you).\n  Fonts, colour tokens (light\
    \ + dark), base styles every component uses, and window.QB.\n  Palette: navy from the app logo, Canada red for highlights,\
    \ olive/CADPAT-style greens.\n-->\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\"\
    \ href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n\n<style>\n:root {\n  --qb-bg: #f1f0eb; --qb-panel: #ffffff; --qb-panel-2: #f8f7f3; --qb-ink: #1b2230;\
    \ --qb-muted: #5d6573; --qb-line: #dedbd2;\n  --qb-accent: #2e4a70; --qb-accent-ink: #ffffff; --qb-accent-soft: #e2e8f1;\n\
    \  --qb-red: #c8102e; --qb-red-soft: #fbe5e8;\n  --qb-good: #4d6a2c; --qb-good-soft: #e8eedd; --qb-bad: #b3261e; --qb-bad-soft:\
    \ #fbeae8; --qb-warn: #8a5d00; --qb-warn-soft: #fbf0d2;\n  --qb-hero: #2f4466; --qb-hero-ink: #f3f0e6; --qb-olive: #556b2f;\
    \ --qb-khaki: #9a8f62;\n  --qb-shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.07);\n  --qb-radius: 12px;\n\
    \  color-scheme: light;\n  --qb-serif: \"Barlow Condensed\", \"Arial Narrow\", \"Segoe UI\", sans-serif;   /* headings\
    \ */\n  --qb-sans: \"Barlow\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n@media (prefers-color-scheme:\
    \ dark) {\n  :root:not([data-theme=\"light\"]) {\n    --qb-bg: #0f1318; --qb-panel: #18202a; --qb-panel-2: #131a22; --qb-ink:\
    \ #e8eaee; --qb-muted: #99a3b0; --qb-line: #2a3442;\n    --qb-accent: #8fb3e3; --qb-accent-ink: #0c1522; --qb-accent-soft:\
    \ #1d2b3f;\n    --qb-red: #ff5d6c; --qb-red-soft: #3a1820;\n    --qb-good: #a5c67a; --qb-good-soft: #232f18; --qb-bad:\
    \ #f28b82; --qb-bad-soft: #3b201d; --qb-warn: #e5b94e; --qb-warn-soft: #3a3017;\n    --qb-hero: #1c2a40; --qb-hero-ink:\
    \ #eef0f3;\n    --qb-shadow: none;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --qb-bg: #0f1318;\
    \ --qb-panel: #18202a; --qb-panel-2: #131a22; --qb-ink: #e8eaee; --qb-muted: #99a3b0; --qb-line: #2a3442;\n  --qb-accent:\
    \ #8fb3e3; --qb-accent-ink: #0c1522; --qb-accent-soft: #1d2b3f;\n  --qb-red: #ff5d6c; --qb-red-soft: #3a1820;\n  --qb-good:\
    \ #a5c67a; --qb-good-soft: #232f18; --qb-bad: #f28b82; --qb-bad-soft: #3b201d; --qb-warn: #e5b94e; --qb-warn-soft: #3a3017;\n\
    \  --qb-hero: #1c2a40; --qb-hero-ink: #eef0f3;\n  --qb-shadow: none;\n  color-scheme: dark;\n}\n\n/* Override the Anvil\
    \ theme's page chrome so our design owns the page. */\nhtml, body { background: var(--qb-bg) !important; color: var(--qb-ink);\
    \ }\nbody { font: 16px/1.55 var(--qb-sans); margin: 0; }\n\n.qb, .qb * { box-sizing: border-box; }\n.qb { font: 16px/1.55\
    \ var(--qb-sans); color: var(--qb-ink); }\n.qb h1, .qb h2, .qb h3 { font-family: var(--qb-serif); font-weight: 700; line-height:\
    \ 1.1; margin: 0 0 .4em; letter-spacing: .005em; color: var(--qb-ink); }\n.qb h1 { font-size: 2.3rem; } .qb h2 { font-size:\
    \ 1.5rem; } .qb h3 { font-size: 1.2rem; }\n.qb p { margin: 0 0 .8em; }\n.qb a { color: var(--qb-accent); }\n.qb [hidden]\
    \ { display: none !important; }\n.qb .muted { color: var(--qb-muted); } .qb .small { font-size: .875rem; }\n.qb .wrap\
    \ { max-width: 980px; margin: 0 auto; padding: 28px 16px 96px; }\n.qb .narrow { max-width: 720px; margin: 0 auto; }\n\
    .qb .card { background: var(--qb-panel); border: 1px solid var(--qb-line); border-radius: var(--qb-radius); box-shadow:\
    \ var(--qb-shadow); }\n/* :where() keeps this reset low-priority so page styles (margins, padding) win. */\n.qb :where(button.card)\
    \ { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; margin: 0; -webkit-appearance: none;\
    \ appearance: none; }\n.qb :where(button.card):focus-visible { outline: 2px solid var(--qb-accent); outline-offset: 2px;\
    \ }\n.qb .pad { padding: 22px 24px; }\n.qb .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n\
    .qb .spacer { flex: 1; }\n.qb .stack > * + * { margin-top: 14px; }\n.qb .kind { font-size: .74rem; letter-spacing: .12em;\
    \ text-transform: uppercase; color: var(--qb-red); font-weight: 700; }\n.qb .crumbs { font-size: .9rem; margin-bottom:\
    \ 12px; }\n.qb .crumbs button { all: unset; cursor: pointer; color: var(--qb-accent); }\n.qb .crumbs button:hover { text-decoration:\
    \ underline; }\n\n.qb .btn { font: inherit; font-size: .95rem; border: 1px solid var(--qb-line); background: var(--qb-panel);\
    \ color: var(--qb-ink); border-radius: 10px; padding: 9px 15px; cursor: pointer; display: inline-flex; align-items: center;\
    \ justify-content: center; gap: 6px; line-height: 1.3; text-decoration: none; transition: border-color .12s, filter .12s,\
    \ background .12s; }\n.qb .btn:hover { border-color: var(--qb-muted); }\n.qb .btn.primary { background: var(--qb-accent);\
    \ border-color: var(--qb-accent); color: var(--qb-accent-ink); font-weight: 600; }\n.qb .btn.primary:hover { filter: brightness(1.07);\
    \ }\n.qb .btn.ghost { background: transparent; border-color: transparent; color: var(--qb-muted); }\n.qb .btn.ghost:hover\
    \ { color: var(--qb-ink); background: var(--qb-panel); }\n.qb .btn.danger { color: var(--qb-bad); }\n.qb .btn.sm { padding:\
    \ 5px 10px; font-size: .86rem; }\n.qb .btn.block { width: 100%; }\n.qb .btn:disabled { opacity: .5; cursor: not-allowed;\
    \ }\n.qb .btn:focus-visible, .qb input:focus, .qb textarea:focus, .qb select:focus { outline: 2px solid var(--qb-accent);\
    \ outline-offset: 1px; }\n\n.qb input[type=text], .qb input[type=email], .qb input[type=password], .qb textarea, .qb select\
    \ {\n  font: inherit; color: var(--qb-ink); background: var(--qb-panel-2); border: 1px solid var(--qb-line); border-radius:\
    \ 10px; padding: 10px 12px; width: 100%; margin: 0; box-shadow: none; height: auto;\n}\n.qb textarea { min-height: 90px;\
    \ resize: vertical; line-height: 1.45; }\n.qb label.f { display: block; font-weight: 600; font-size: .92rem; margin-bottom:\
    \ 5px; }\n.qb .hint { font-size: .85rem; color: var(--qb-muted); margin-top: 4px; }\n.qb .toggle { display: flex; gap:\
    \ 10px; align-items: flex-start; cursor: pointer; }\n.qb .toggle input { margin-top: 5px; accent-color: var(--qb-accent);\
    \ }\n\n.qb .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; padding: 2px 9px; border-radius:\
    \ 99px; background: var(--qb-panel-2); border: 1px solid var(--qb-line); color: var(--qb-muted); white-space: nowrap;\
    \ }\n.qb .badge.good { background: var(--qb-good-soft); color: var(--qb-good); border-color: transparent; }\n.qb .badge.warn\
    \ { background: var(--qb-warn-soft); color: var(--qb-warn); border-color: transparent; }\n.qb .badge.bad { background:\
    \ var(--qb-bad-soft); color: var(--qb-bad); border-color: transparent; }\n.qb .badge.accent { background: var(--qb-accent-soft);\
    \ color: var(--qb-accent); border-color: transparent; }\n\n.qb .bar { height: 6px; background: var(--qb-line); border-radius:\
    \ 99px; overflow: hidden; }\n.qb .bar > span { display: block; height: 100%; width: 0; background: var(--qb-accent); border-radius:\
    \ 99px; transition: width .3s; }\n\n.qb .avatar { --c: var(--qb-accent); width: 36px; height: 36px; border-radius: 50%;\
    \ background: var(--c); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: .9rem; flex:\
    \ none; overflow: hidden; }\n.qb .avatar img { width: 100%; height: 100%; object-fit: cover; }\n.qb .avatar.lg { width:\
    \ 72px; height: 72px; font-size: 1.6rem; }\n\n.qb .empty { text-align: center; padding: 48px 20px; border: 2px dashed\
    \ var(--qb-line); border-radius: var(--qb-radius); color: var(--qb-muted); }\n.qb .feedback { margin-top: 16px; padding:\
    \ 14px 16px; border-radius: 12px; }\n.qb .feedback.good { background: var(--qb-good-soft); }\n.qb .feedback.bad { background:\
    \ var(--qb-bad-soft); }\n.qb .feedback.info { background: var(--qb-warn-soft); color: var(--qb-warn); }\n.qb .feedback\
    \ strong { display: block; margin-bottom: 4px; }\n.qb .spin { display: inline-block; width: 14px; height: 14px; border:\
    \ 2px solid var(--qb-line); border-top-color: var(--qb-accent); border-radius: 50%; animation: qb-spin .8s linear infinite;\
    \ vertical-align: -2px; }\n@keyframes qb-spin { to { transform: rotate(360deg); } }\n.qb .fade-in { animation: qb-fade\
    \ .25s ease-out; }\n@keyframes qb-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform:\
    \ none; } }\n\n#qb-toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 1000; display:\
    \ grid; gap: 8px; font: 15px/1.4 var(--qb-sans); }\n#qb-toasts .t { background: var(--qb-ink); color: var(--qb-bg); padding:\
    \ 10px 16px; border-radius: 10px; box-shadow: var(--qb-shadow); max-width: 90vw; }\n#qb-toasts .t.err { background: var(--qb-bad);\
    \ color: #fff; }\n@media (max-width: 620px) { .qb h1 { font-size: 1.6rem; } .qb .pad { padding: 18px; } }\n\n/* Anvil's\
    \ loading spinner (#loadingSpinner), replaced by loading_icon.png: the dotted ring\n   spins around the soldier, who sits\
    \ on a white disc so they read in dark mode too.\n   The two layers come from tools/make_loading_icon.py; sync puts them\
    \ in the Anvil theme. */\n#loadingSpinner { --anvil-spinner-size: 120px; --anvil-spinner-bg: var(--qb-bg); width: 120px;\
    \ height: 120px; }\n#loadingSpinner > svg { display: none !important; }\n#loadingSpinner::before, #loadingSpinner::after\
    \ { content: \"\"; position: absolute; inset: 0; border-radius: 50%; }\n#loadingSpinner::before { background: url(\"_/theme/loading_ring.png\"\
    ) center / contain no-repeat; animation: qb-spin 2.4s linear infinite; }\n#loadingSpinner::after { background: url(\"\
    _/theme/loading_soldier.png\") center / contain no-repeat, radial-gradient(circle closest-side, #fff 83%, transparent\
    \ 84%); }\n@media (prefers-reduced-motion: reduce) { #loadingSpinner::before { animation-duration: 8s; } }\n</style>\n\
    \n<script>\n/* window.QB: shared helpers + component registry.\n   Each form's HTML registers a component with QB.define(name,\
    \ mountFn).\n   Python mounts it with:  window.QB.mount(name, rootNode, jsonString, emit)\n   and the component talks\
    \ back by calling emit(eventName, payloadObject). */\n(function () {\n  if (window.QB && window.QB.__v) return;\n  var\
    \ QB = window.QB = { __v: 1, components: {} };\n\n  QB.esc = function (s) {\n    return String(s == null ? '' : s).replace(/[&<>\"\
    ']/g, function (c) {\n      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c];\n  \
    \  });\n  };\n  QB.fmtDate = function (iso) {\n    if (!iso) return '';\n    return new Date(iso).toLocaleDateString(undefined,\
    \ { day: 'numeric', month: 'short', year: 'numeric' });\n  };\n  QB.scoreClass = function (pct) { return pct >= 80 ? 'good'\
    \ : pct >= 50 ? 'warn' : 'bad'; };\n  QB.initials = function (name) {\n    var p = String(name || '?').trim().split(/\\\
    s+/);\n    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();\n  };\n  QB.avatar = function\
    \ (user, cls) {\n    user = user || {};\n    var inner = user.avatar_url ? '<img alt=\"\" src=\"' + QB.esc(user.avatar_url)\
    \ + '\">' : QB.esc(QB.initials(user.display_name || user.email));\n    return '<span class=\"avatar ' + (cls || '') +\
    \ '\" style=\"--c:' + QB.esc(user.avatar_color || '#2e4a70') + '\">' + inner + '</span>';\n  };\n  QB.normAnswer = function\
    \ (s) {\n    return String(s == null ? '' : s).trim().toLowerCase().replace(/\\s+/g, ' ').replace(/[.!?]+$/, '');\n  };\n\
    \  QB.shuffle = function (a) {\n    a = a.slice();\n    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random()\
    \ * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }\n    return a;\n  };\n  QB.toast = function (msg, isErr) {\n    var\
    \ box = document.getElementById('qb-toasts');\n    if (!box) { box = document.createElement('div'); box.id = 'qb-toasts';\
    \ document.body.appendChild(box); }\n    var t = document.createElement('div');\n    t.className = 't' + (isErr ? ' err'\
    \ : '');\n    t.textContent = msg;\n    box.appendChild(t);\n    setTimeout(function () { t.remove(); }, isErr ? 7000\
    \ : 3500);\n  };\n  // Wrap the Python callback: payloads go over as JSON strings, and the\n  // returned value (a Promise\
    \ if Python made a server call) is passed back.\n  QB.wrapEmit = function (emit) {\n    return function (name, payload)\
    \ {\n      try { return Promise.resolve(emit ? emit(name, JSON.stringify(payload == null ? {} : payload)) : null); }\n\
    \      catch (e) { console.error(e); return Promise.reject(e); }\n    };\n  };\n  // Theme: \"auto\" follows the device;\
    \ \"light\"/\"dark\" are remembered per device.\n  QB.applyTheme = function (t) {\n    if (t === 'light' || t === 'dark')\
    \ document.documentElement.setAttribute('data-theme', t);\n    else document.documentElement.removeAttribute('data-theme');\n\
    \  };\n  try { QB.applyTheme(localStorage.getItem('qb.theme')); } catch (e) {}\n\n  QB.leaf = function (cls) {\n    return\
    \ '<svg class=\"' + (cls || 'leaf') + '\" viewBox=\"-2015 -2000 4030 4030\" aria-hidden=\"true\"><path fill=\"currentColor\"\
    \ d=\"m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572\
    \ 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65\
