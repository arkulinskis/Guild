    .qb-auth .tabs { display: flex; gap: 4px; padding: 4px; background: var(--qb-panel-2); border: 1px solid var(--qb-line); border-radius: 12px; margin-bottom: 22px; }
    .qb-auth .tabs button { all: unset; flex: 1; text-align: center; cursor: pointer; padding: 8px; border-radius: 9px; font-weight: 600; font-size: .92rem; color: var(--qb-muted); }
    .qb-auth .tabs button.on { background: var(--qb-panel); color: var(--qb-ink); box-shadow: var(--qb-shadow); }
    .qb-auth form > div + div { margin-top: 14px; }
    .qb-auth .or { display: flex; align-items: center; gap: 10px; color: var(--qb-muted); font-size: .85rem; margin: 18px 0; }
    .qb-auth .or::before, .qb-auth .or::after { content: ""; flex: 1; height: 1px; background: var(--qb-line); }
