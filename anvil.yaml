    .qb-cur .body > * + * { margin-top: 10px; }
    .qb-cur .part { background: var(--qb-panel); border: 1px solid var(--qb-line); border-radius: 10px; }
    .qb-cur .part .phead { padding: 10px 12px; }
    .qb-cur .part .num { font-size: 1rem; color: var(--qb-muted); }
