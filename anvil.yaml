name: Scratch 1
native_deps:
  head_html: |
    <!--
      QUIZ APP — SHARED THEME + CORE HELPERS
      Paste this whole file into:  Anvil IDE → Native Libraries
      It loads the fonts, defines the colour tokens (light + dark), the base
      styles every component uses, and a tiny window.QB helper object.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    :root {
      --qb-bg: #f6f4ef; --qb-panel: #ffffff; --qb-panel-2: #fbfaf7; --qb-ink: #1f1f1d; --qb-muted: #6d6b66; --qb-line: #e4e0d6;
      --qb-accent: #2f6f62; --qb-accent-ink: #ffffff; --qb-accent-soft: #e3efea;
      --qb-good: #2e7d32; --qb-good-soft: #e6f3e7; --qb-bad: #b3261e; --qb-bad-soft: #fbeae8; --qb-warn: #8a5d00; --qb-warn-soft: #fdf3d7;
      --qb-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
      --qb-radius: 14px;
      color-scheme: light;
      --qb-serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --qb-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --qb-bg: #161615; --qb-panel: #212120; --qb-panel-2: #1b1b1a; --qb-ink: #ecebe6; --qb-muted: #a3a09a; --qb-line: #383733;
        --qb-accent: #6cc2ad; --qb-accent-ink: #0f201c; --qb-accent-soft: #1f3631;
        --qb-good: #82c986; --qb-good-soft: #1c321e; --qb-bad: #f28b82; --qb-bad-soft: #3b201d; --qb-warn: #e5b94e; --qb-warn-soft: #3a3017;
        --qb-shadow: none;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --qb-bg: #161615; --qb-panel: #212120; --qb-panel-2: #1b1b1a; --qb-ink: #ecebe6; --qb-muted: #a3a09a; --qb-line: #383733;
      --qb-accent: #6cc2ad; --qb-accent-ink: #0f201c; --qb-accent-soft: #1f3631;
      --qb-good: #82c986; --qb-good-soft: #1c321e; --qb-bad: #f28b82; --qb-bad-soft: #3b201d; --qb-warn: #e5b94e; --qb-warn-soft: #3a3017;
      --qb-shadow: none;
      color-scheme: dark;
    }

    /* Override the Anvil theme's page chrome so our design owns the page. */
    html, body { background: var(--qb-bg) !important; color: var(--qb-ink); }
    body { font: 16px/1.55 var(--qb-sans); margin: 0; }

    .qb, .qb * { box-sizing: border-box; }
    .qb { font: 16px/1.55 var(--qb-sans); color: var(--qb-ink); }
    .qb h1, .qb h2, .qb h3 { font-family: var(--qb-serif); font-weight: 600; line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.01em; color: var(--qb-ink); }
    .qb h1 { font-size: 2rem; } .qb h2 { font-size: 1.4rem; } .qb h3 { font-size: 1.12rem; }
    .qb p { margin: 0 0 .8em; }
    .qb a { color: var(--qb-accent); }
    .qb [hidden] { display: none !important; }
    .qb .muted { color: var(--qb-muted); } .qb .small { font-size: .875rem; }
    .qb .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 96px; }
    .qb .narrow { max-width: 720px; margin: 0 auto; }
    .qb .card { background: var(--qb-panel); border: 1px solid var(--qb-line); border-radius: var(--qb-radius); box-shadow: var(--qb-shadow); }
    /* :where() keeps this reset low-priority so page styles (margins, padding) win. */
    .qb :where(button.card) { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; margin: 0; -webkit-appearance: none; appearance: none; }
    .qb :where(button.card):focus-visible { outline: 2px solid var(--qb-accent); outline-offset: 2px; }
    .qb .pad { padding: 22px 24px; }
    .qb .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .qb .spacer { flex: 1; }
    .qb .stack > * + * { margin-top: 14px; }
    .qb .kind { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--qb-accent); font-weight: 700; }
    .qb .crumbs { font-size: .9rem; margin-bottom: 12px; }
    .qb .crumbs button { all: unset; cursor: pointer; color: var(--qb-accent); }
    .qb .crumbs button:hover { text-decoration: underline; }

    .qb .btn { font: inherit; font-size: .95rem; border: 1px solid var(--qb-line); background: var(--qb-panel); color: var(--qb-ink); border-radius: 10px; padding: 9px 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.3; text-decoration: none; transition: border-color .12s, filter .12s, background .12s; }
    .qb .btn:hover { border-color: var(--qb-muted); }
    .qb .btn.primary { background: var(--qb-accent); border-color: var(--qb-accent); color: var(--qb-accent-ink); font-weight: 600; }
    .qb .btn.primary:hover { filter: brightness(1.07); }
    .qb .btn.ghost { background: transparent; border-color: transparent; color: var(--qb-muted); }
    .qb .btn.ghost:hover { color: var(--qb-ink); background: var(--qb-panel); }
    .qb .btn.danger { color: var(--qb-bad); }
    .qb .btn.sm { padding: 5px 10px; font-size: .86rem; }
    .qb .btn.block { width: 100%; }
    .qb .btn:disabled { opacity: .5; cursor: not-allowed; }
    .qb .btn:focus-visible, .qb input:focus, .qb textarea:focus, .qb select:focus { outline: 2px solid var(--qb-accent); outline-offset: 1px; }

    .qb input[type=text], .qb input[type=email], .qb input[type=password], .qb textarea, .qb select {
      font: inherit; color: var(--qb-ink); background: var(--qb-panel-2); border: 1px solid var(--qb-line); border-radius: 10px; padding: 10px 12px; width: 100%; margin: 0; box-shadow: none; height: auto;
    }
    .qb textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
    .qb label.f { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 5px; }
    .qb .hint { font-size: .85rem; color: var(--qb-muted); margin-top: 4px; }
    .qb .toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
    .qb .toggle input { margin-top: 5px; accent-color: var(--qb-accent); }

    .qb .badge { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; padding: 2px 9px; border-radius: 99px; background: var(--qb-panel-2); border: 1px solid var(--qb-line); color: var(--qb-muted); white-space: nowrap; }
    .qb .badge.good { background: var(--qb-good-soft); color: var(--qb-good); border-color: transparent; }
    .qb .badge.warn { background: var(--qb-warn-soft); color: var(--qb-warn); border-color: transparent; }
    .qb .badge.bad { background: var(--qb-bad-soft); color: var(--qb-bad); border-color: transparent; }
    .qb .badge.accent { background: var(--qb-accent-soft); color: var(--qb-accent); border-color: transparent; }

    .qb .bar { height: 6px; background: var(--qb-line); border-radius: 99px; overflow: hidden; }
    .qb .bar > span { display: block; height: 100%; width: 0; background: var(--qb-accent); border-radius: 99px; transition: width .3s; }

    .qb .avatar { --c: var(--qb-accent); width: 36px; height: 36px; border-radius: 50%; background: var(--c); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: .9rem; flex: none; overflow: hidden; }
    .qb .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .qb .avatar.lg { width: 72px; height: 72px; font-size: 1.6rem; }

    .qb .empty { text-align: center; padding: 48px 20px; border: 2px dashed var(--qb-line); border-radius: var(--qb-radius); color: var(--qb-muted); }
    .qb .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; }
    .qb .feedback.good { background: var(--qb-good-soft); }
    .qb .feedback.bad { background: var(--qb-bad-soft); }
    .qb .feedback.info { background: var(--qb-warn-soft); color: var(--qb-warn); }
    .qb .feedback strong { display: block; margin-bottom: 4px; }
    .qb .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--qb-line); border-top-color: var(--qb-accent); border-radius: 50%; animation: qb-spin .8s linear infinite; vertical-align: -2px; }
    @keyframes qb-spin { to { transform: rotate(360deg); } }
    .qb .fade-in { animation: qb-fade .25s ease-out; }
    @keyframes qb-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    #qb-toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 1000; display: grid; gap: 8px; font: 15px/1.4 var(--qb-sans); }
    #qb-toasts .t { background: var(--qb-ink); color: var(--qb-bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--qb-shadow); max-width: 90vw; }
    #qb-toasts .t.err { background: var(--qb-bad); color: #fff; }
    @media (max-width: 620px) { .qb h1 { font-size: 1.6rem; } .qb .pad { padding: 18px; } }
    </style>

    <script>
    /* window.QB: shared helpers + component registry.
       Each form's HTML registers a component with QB.define(name, mountFn).
       Python mounts it with:  window.QB.mount(name, rootNode, jsonString, emit)
       and the component talks back by calling emit(eventName, payloadObject). */
    (function () {
      if (window.QB && window.QB.__v) return;
      var QB = window.QB = { __v: 1, components: {} };

      QB.esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      QB.fmtDate = function (iso) {
        if (!iso) return '';
        return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      };
      QB.scoreClass = function (pct) { return pct >= 80 ? 'good' : pct >= 50 ? 'warn' : 'bad'; };
      QB.initials = function (name) {
        var p = String(name || '?').trim().split(/\s+/);
        return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
      };
      QB.avatar = function (user, cls) {
        user = user || {};
        var inner = user.avatar_url ? '<img alt="" src="' + QB.esc(user.avatar_url) + '">' : QB.esc(QB.initials(user.display_name || user.email));
        return '<span class="avatar ' + (cls || '') + '" style="--c:' + QB.esc(user.avatar_color || '#2f6f62') + '">' + inner + '</span>';
      };
      QB.normAnswer = function (s) {
        return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '');
      };
      QB.shuffle = function (a) {
        a = a.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      };
      QB.toast = function (msg, isErr) {
        var box = document.getElementById('qb-toasts');
        if (!box) { box = document.createElement('div'); box.id = 'qb-toasts'; document.body.appendChild(box); }
        var t = document.createElement('div');
        t.className = 't' + (isErr ? ' err' : '');
        t.textContent = msg;
        box.appendChild(t);
        setTimeout(function () { t.remove(); }, isErr ? 7000 : 3500);
      };
      // Wrap the Python callback: payloads go over as JSON strings, and the
      // returned value (a Promise if Python made a server call) is passed back.
      QB.wrapEmit = function (emit) {
        return function (name, payload) {
          try { return Promise.resolve(emit ? emit(name, JSON.stringify(payload == null ? {} : payload)) : null); }
          catch (e) { console.error(e); return Promise.reject(e); }
        };
      };
      // Theme: "auto" follows the device; "light"/"dark" are remembered per device.
      QB.applyTheme = function (t) {
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
      };
      try { QB.applyTheme(localStorage.getItem('qb.theme')); } catch (e) {}

      QB.define = function (name, mountFn) { QB.components[name] = mountFn; };
      QB.mount = function (name, root, json, emit) {
        var fn = QB.components[name];
        if (!fn) { console.error('QB component not loaded: ' + name); return null; }
        if (!root) { console.error('QB mount: no root node for ' + name); return null; }
        var data = typeof json === 'string' ? JSON.parse(json || '{}') : (json || {});
        return fn(root, data, QB.wrapEmit(emit));
      };
    })();
    </script>

    <!-- ===== Main component ===== -->
    <style>
    .qb-header { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--qb-bg) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--qb-line); }
    .qb-header .in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; }
    .qb-header .brand { all: unset; cursor: pointer; font-family: var(--qb-serif); font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 9px; color: var(--qb-ink); }
    .qb-header .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--qb-accent); color: var(--qb-accent-ink); display: grid; place-items: center; font-size: .95rem; }
    .qb-header nav { display: flex; gap: 4px; margin-left: auto; }
    .qb-header nav button { all: unset; cursor: pointer; color: var(--qb-muted); padding: 6px 11px; border-radius: 8px; font-size: .95rem; }
    .qb-header nav button.on, .qb-header nav button:hover { color: var(--qb-ink); background: var(--qb-panel); }
    .qb-header .me { position: relative; }
    .qb-header .me > button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 99px; padding: 2px; }
    .qb-header .me > button:focus-visible { outline: 2px solid var(--qb-accent); }
    .qb-header .xp { font-size: .8rem; color: var(--qb-muted); }
    .qb-header .menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; padding: 6px; z-index: 60; }
    .qb-header .menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--qb-line); margin-bottom: 4px; }
    .qb-header .menu button { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 8px 10px; border-radius: 8px; font-size: .93rem; }
    .qb-header .menu button:hover { background: var(--qb-panel-2); }
    .qb-page { min-height: calc(100vh - 60px); }
    @media (max-width: 520px) { .qb-header .xp, .qb-header .brand .name { display: none; } .qb-header .in { gap: 10px; } }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('header', function (root, data, emit) {
        var esc = QB.esc;
        var S = { user: data.user || null, active: data.active || 'home', open: false, appName: data.app_name || 'Quizbook' };

        function render() {
          var u = S.user;
          root.innerHTML = '<header class="qb-header"><div class="in">' +
            '<button class="brand" data-action="nav" data-page="home"><span class="logo">' + esc(S.appName[0]) + '</span><span class="name">' + esc(S.appName) + '</span></button>' +
            (u ? '<nav>' +
                '<button data-action="nav" data-page="home" class="' + (S.active === 'home' ? 'on' : '') + '">Home</button>' +
                '<button data-action="nav" data-page="profile" class="' + (S.active === 'profile' ? 'on' : '') + '">Profile</button>' +
              '</nav>' +
              '<div class="me"><button data-action="menu" aria-haspopup="true" aria-expanded="' + S.open + '">' +
                '<span class="xp">' + (u.xp || 0) + ' XP' + (u.streak ? ' · 🔥 ' + u.streak : '') + '</span>' + QB.avatar(u) + '</button>' +
                (S.open ? '<div class="menu card fade-in"><div class="who"><strong>' + esc(u.display_name) + '</strong><div class="muted small">' + esc(u.email) + '</div></div>' +
                  '<button data-action="nav" data-page="profile">Your profile</button>' +
                  '<button data-action="signout">Sign out</button></div>' : '') +
              '</div>' : '') +
            '</div></header>';
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          e.qbHeader = true; // tells the outside-click handler below to ignore this click
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'menu') { S.open = !S.open; render(); return; }
          S.open = false;
          if (a === 'nav') { S.active = el.dataset.page; render(); emit('nav', { page: el.dataset.page }); }
          else if (a === 'signout') { render(); emit('signout', {}); }
        });
        document.addEventListener('click', function (e) {
          if (S.open && !e.qbHeader) { S.open = false; render(); }
        });

        render();
        return {
          setUser: function (json) { S.user = json ? JSON.parse(json) : null; render(); },
          setActive: function (page) { S.active = page; S.open = false; render(); }
        };
      });
    })();
    </script>

    <!-- ===== AuthPage component ===== -->
    <style>
    .qb-auth { min-height: calc(100vh - 60px); display: grid; grid-template-columns: 1.05fr 1fr; }
    .qb-auth .side { background: var(--qb-accent); color: var(--qb-accent-ink); padding: 56px 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .qb-auth .side h1 { color: inherit; font-size: 2.6rem; max-width: 12ch; }
    .qb-auth .side p { opacity: .85; max-width: 38ch; font-size: 1.05rem; }
    .qb-auth .side .deco { position: absolute; right: -60px; bottom: -60px; width: 300px; height: 300px; border-radius: 50%; border: 44px solid color-mix(in srgb, var(--qb-accent-ink) 14%, transparent); }
    .qb-auth .side .deco.two { right: 120px; bottom: 140px; width: 90px; height: 90px; border-width: 16px; }
    .qb-auth .side ul { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 10px; position: relative; }
    .qb-auth .side li::before { content: "✓"; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; margin-right: 10px; background: color-mix(in srgb, var(--qb-accent-ink) 18%, transparent); font-size: .8rem; }
    .qb-auth .main { display: grid; place-items: center; padding: 40px 16px; }
    .qb-auth .box { width: min(400px, 100%); }
    .qb-auth .tabs { display: flex; gap: 4px; padding: 4px; background: var(--qb-panel-2); border: 1px solid var(--qb-line); border-radius: 12px; margin-bottom: 22px; }
    .qb-auth .tabs button { all: unset; flex: 1; text-align: center; cursor: pointer; padding: 8px; border-radius: 9px; font-weight: 600; font-size: .92rem; color: var(--qb-muted); }
    .qb-auth .tabs button.on { background: var(--qb-panel); color: var(--qb-ink); box-shadow: var(--qb-shadow); }
    .qb-auth form > div + div { margin-top: 14px; }
    .qb-auth .or { display: flex; align-items: center; gap: 10px; color: var(--qb-muted); font-size: .85rem; margin: 18px 0; }
    .qb-auth .or::before, .qb-auth .or::after { content: ""; flex: 1; height: 1px; background: var(--qb-line); }
    .qb-auth .link { all: unset; cursor: pointer; color: var(--qb-accent); font-size: .88rem; }
    .qb-auth .link:hover { text-decoration: underline; }
    @media (max-width: 820px) { .qb-auth { grid-template-columns: 1fr; } .qb-auth .side { padding: 32px 20px; } .qb-auth .side h1 { font-size: 1.9rem; } .qb-auth .side ul, .qb-auth .deco { display: none; } }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('auth', function (root, data, emit) {
        var esc = QB.esc;
        var S = { mode: 'login', busy: false, msg: null, email: '' };

        function form() {
          if (S.mode === 'reset') {
            return '<h2>Reset your password</h2><p class="muted small">We\'ll email you a link to choose a new one.</p>' +
              '<form data-form="reset"><div><label class="f" for="qbE">Email</label><input type="email" id="qbE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><button class="btn primary block" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>' : 'Send reset link') + '</button></div></form>' +
              '<p style="margin-top:14px"><button class="link" data-action="mode" data-mode="login">← Back to sign in</button></p>';
          }
          var signup = S.mode === 'signup';
          return '<div class="tabs" role="tablist">' +
              '<button role="tab" data-action="mode" data-mode="login" class="' + (!signup ? 'on' : '') + '">Sign in</button>' +
              '<button role="tab" data-action="mode" data-mode="signup" class="' + (signup ? 'on' : '') + '">Create account</button></div>' +
            '<h2>' + (signup ? 'Create your account' : 'Welcome back') + '</h2>' +
            '<p class="muted small">' + (signup ? 'Your scores, streak and progress are saved to your profile.' : 'Sign in to pick up where you left off.') + '</p>' +
            '<form data-form="' + S.mode + '">' +
              (signup ? '<div><label class="f" for="qbN">Your name</label><input type="text" id="qbN" name="name" required autocomplete="name" placeholder="How should we greet you?"></div>' : '') +
              '<div><label class="f" for="qbE">Email</label><input type="email" id="qbE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><label class="f" for="qbP">Password</label><input type="password" id="qbP" name="password" required minlength="' + (signup ? 8 : 1) + '" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
                (signup ? '<div class="hint">At least 8 characters.</div>' : '<div class="hint" style="text-align:right"><button type="button" class="link" data-action="mode" data-mode="reset">Forgot password?</button></div>') + '</div>' +
              '<div><button class="btn primary block" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>' : signup ? 'Create account' : 'Sign in') + '</button></div>' +
            '</form>' +
            (data.google ? '<div class="or">or</div><button class="btn block" data-action="google"' + (S.busy ? ' disabled' : '') + '>Continue with Google</button>' : '');
        }

        function render() {
          root.innerHTML = '<div class="qb-auth">' +
            '<div class="side"><div style="position:relative"><div class="kind" style="color:inherit;opacity:.8">' + esc(data.app_name || 'Quizbook') + '</div>' +
              '<h1>' + esc(data.headline || 'Learn it. Test it. Remember it.') + '</h1>' +
              '<p>' + esc(data.tagline || 'Flashcards that come back just before you would forget them.') + '</p>' +
              '<ul><li>Answer in your head, then reveal</li><li>Cards you know come back less often</li><li>Track cards learned, streaks and progress</li></ul></div>' +
              '<div class="deco"></div><div class="deco two"></div></div>' +
            '<div class="main"><div class="box fade-in">' + form() + '<div data-el="msg"></div></div></div></div>';
          var f = root.querySelector('form');
          if (f) f.onsubmit = submit;
          showMsg();
          var first = root.querySelector('form input:not([value]), form input[value=""]');
          if (first) first.focus();
        }

        function showMsg() {
          var box = root.querySelector('[data-el=msg]');
          if (box) box.innerHTML = S.msg ? '<div class="feedback ' + (S.msg.ok ? 'good' : 'bad') + '">' + esc(S.msg.text) + '</div>' : '';
        }

        // Toggle the busy state in place so typed values are kept.
        function setBusy(on) {
          S.busy = on;
          root.querySelectorAll('.box button[type=submit], .box [data-action=google]').forEach(function (b) {
            b.disabled = on;
            if (b.type === 'submit') {
              if (on) { b.dataset.label = b.innerHTML; b.innerHTML = '<span class="spin"></span>'; }
              else if (b.dataset.label) b.innerHTML = b.dataset.label;
            }
          });
        }

        function run(event, payload) {
          if (S.busy) return;
          S.msg = null; showMsg(); setBusy(true);
          emit(event, payload).then(function (res) {
            setBusy(false);
            res = res || {};
            if (res.ok && !res.message) return; // Python navigates away on success
            S.msg = res.ok ? { ok: true, text: res.message } : { ok: false, text: res.error || 'Something went wrong.' };
            if (res.mode && res.mode !== S.mode) { S.mode = res.mode; render(); } else showMsg();
          }, function (err) {
            setBusy(false); S.msg = { ok: false, text: (err && err.message) || String(err) }; showMsg();
          });
        }

        function submit(e) {
          e.preventDefault();
          var fd = new FormData(e.target), v = {};
          fd.forEach(function (val, key) { v[key] = String(val); });
          S.email = v.email || '';
          run(e.target.dataset.form, v);
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          if (el.dataset.action === 'mode') {
            var em = root.querySelector('input[name=email]');
            if (em) S.email = em.value;
            S.mode = el.dataset.mode; S.msg = null; render();
          } else if (el.dataset.action === 'google') run('google', {});
        });

        render();
        return {};
      });
    })();
    </script>

    <!-- ===== HomePage component ===== -->
    <style>
    .qb-home .hero { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 22px; }
    .qb-home .hero p { margin: 0; }
    .qb-home .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .qb-home .stat { padding: 16px 18px; }
    .qb-home .stat .v { font-family: var(--qb-serif); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
    .qb-home .stat .k { font-size: .82rem; color: var(--qb-muted); }
    .qb-home .continue { width: 100%; display: flex; gap: 16px; align-items: center; padding: 18px 22px; margin-bottom: 26px; border-color: var(--qb-accent); background: linear-gradient(120deg, var(--qb-accent-soft), var(--qb-panel) 70%); }
    .qb-home .continue.calm { border-color: var(--qb-line); background: var(--qb-panel); cursor: default; }
    .qb-home .continue .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--qb-accent); color: var(--qb-accent-ink); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
    .qb-home .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .qb-home .col { display: block; padding: 0; overflow: hidden; transition: transform .12s, border-color .12s; }
    .qb-home .col:hover { transform: translateY(-2px); border-color: var(--qb-accent); }
    .qb-home .col .stripe { height: 6px; background: var(--c, var(--qb-accent)); }
    .qb-home .col .body { padding: 16px 18px; }
    .qb-home .col h3 { margin: 6px 0 4px; word-break: break-word; }
    .qb-home .col .bar { margin: 12px 0 6px; }
    .qb-home .col .bar > span { background: var(--c, var(--qb-accent)); }
    .qb-home section + section { margin-top: 30px; }
    .qb-home .sechead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .qb-home .sechead h2 { margin: 0; font-size: 1.2rem; }
    .qb-home .recent { padding: 6px 0; }
    .qb-home .recent button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 18px; }
    .qb-home .recent button + button { border-top: 1px solid var(--qb-line); }
    .qb-home .recent button:hover { background: var(--qb-panel-2); }
    @media (max-width: 720px) { .qb-home .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('home', function (root, data, emit) {
        var esc = QB.esc;
        var me = data.me || {}, st = data.stats || {}, cols = data.collections || [], recent = data.recent || [], cont = data.continue;
        var h = new Date().getHours();
        var greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
        var first = String(me.display_name || '').split(/\s+/)[0];

        function statTile(v, k) { return '<div class="card stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }
        function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
        function when(iso) {
          if (!iso) return '';
          var days = Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
          return days <= 1 ? 'tomorrow' : days < 7 ? 'in ' + days + ' days' : 'on ' + QB.fmtDate(iso + 'T12:00:00');
        }

        var contHtml = '';
        if (cont && cont.kind === 'review') {
          contHtml = '<button class="card continue" data-action="review"><span class="ico">↻</span><span style="flex:1;min-width:0"><span class="kind">Due today</span><br>' +
            '<strong style="font-size:1.05rem">' + esc(cont.title) + '</strong><br><span class="muted small">' + esc(cont.subtitle) + '</span></span>' +
            '<span class="badge warn">' + cont.due + '</span></button>';
        } else if (cont) {
          contHtml = '<button class="card continue" data-action="quiz" data-id="' + esc(cont.quiz_id) + '"><span class="ico">▶</span><span style="flex:1;min-width:0"><span class="kind">' + (cont.started ? 'Keep going' : 'Start learning') + '</span><br>' +
            '<strong style="font-size:1.05rem">' + esc(cont.title) + '</strong><br><span class="muted small">' + esc(cont.subtitle) + '</span></span><span class="badge accent">new</span></button>';
        } else if (st.total_cards) {
          contHtml = '<div class="card continue calm"><span class="ico">✓</span><span><span class="kind">All caught up</span><br><strong>Nothing is due right now.</strong>' +
            (st.next_due ? '<br><span class="muted small">Your next review is ' + esc(when(st.next_due)) + '.</span>' : '') + '</span></div>';
        }

        root.innerHTML = '<div class="wrap qb-home fade-in">' +
          '<div class="hero"><div><h1>' + greet + (first ? ', ' + esc(first) : '') + '</h1>' +
            '<p class="muted">' + (st.due ? 'You have ' + plural(st.due, 'card') + ' to review today.' : st.learned ? 'You\'ve learned ' + st.learned + ' of ' + st.total_cards + ' cards. Keep it going.' : 'Pick a collection below and start learning.') + '</p></div></div>' +
          '<div class="stats">' +
            statTile(st.due || 0, 'due today') +
            statTile((st.learned || 0) + '<span class="muted" style="font-size:1rem"> / ' + (st.total_cards || 0) + '</span>', 'cards learned') +
            statTile((st.streak || 0) + (st.streak ? ' 🔥' : ''), 'day streak') +
            statTile(st.xp || 0, 'XP earned') +
          '</div>' + contHtml +
          '<section><div class="sechead"><h2>Collections</h2><span class="muted small">' + cols.length + '</span></div>' +
          (cols.length ? '<div class="grid">' + cols.map(function (c) {
            var pct = c.card_count ? Math.round(100 * c.learned / c.card_count) : 0;
            return '<button class="card col" data-action="col" data-id="' + esc(c.id) + '" style="--c:' + esc(c.color || '') + '"><div class="stripe"></div><div class="body">' +
              '<div class="kind" style="color:var(--c, var(--qb-accent))">' + esc(c.kind || 'Collection') + '</div>' +
              '<h3>' + esc(c.title) + '</h3>' +
              (c.description ? '<div class="muted small">' + esc(c.description) + '</div>' : '') +
              '<div class="bar" title="Cards learned"><span style="width:' + pct + '%"></span></div>' +
              '<div class="small">' + (c.started ? c.learned + ' of ' + c.card_count + ' learned' + (c.due ? ' · <span class="badge warn">' + c.due + ' due</span>' : '')
                : '<span class="muted">' + c.quiz_count + (c.quiz_count === 1 ? ' quiz' : ' quizzes') + ' · ' + plural(c.card_count, 'card') + ' · not started</span>') + '</div>' +
              '</div></button>';
          }).join('') + '</div>' : '<div class="empty"><h3>No cards yet</h3><p>Once quizzes are added they will show up here.</p></div>') +
          '</section>' +
          (recent.length ? '<section><div class="sechead"><h2>Recent sessions</h2></div><div class="card recent">' + recent.map(function (r) {
            return '<button data-action="' + (r.quiz_id ? 'quiz' : 'review') + '" data-id="' + esc(r.quiz_id || '') + '"><span><strong>' + esc(r.title) + '</strong><br><span class="muted small">' + esc(r.collection_title) + ' · ' + esc(QB.fmtDate(r.finished)) + '</span></span>' +
              '<span class="row" style="gap:6px"><span class="badge">' + plural(r.reviewed, 'card') + '</span>' + (r.again ? '<span class="badge warn">' + r.again + ' still learning</span>' : '<span class="badge good">all got it</span>') + '</span></button>';
          }).join('') + '</div></section>' : '') +
          '</div>';

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          if (el.dataset.action === 'col') emit('open_collection', { id: el.dataset.id });
          else if (el.dataset.action === 'quiz') emit('open_quiz', { id: el.dataset.id });
          else if (el.dataset.action === 'review') emit('open_review', {});
        });
        return {};
      });
    })();
    </script>

    <!-- ===== CollectionPage component ===== -->
    <style>
    .qb-col .head { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
    .qb-col .head .meta { margin-left: auto; text-align: right; }
    .qb-col .list { display: grid; gap: 8px; }
    .qb-col .item { display: grid; grid-template-columns: 42px 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; transition: border-color .12s, transform .12s; }
    .qb-col .item:hover { border-color: var(--qb-accent); transform: translateX(2px); }
    .qb-col .num { font-family: var(--qb-serif); font-size: 1.15rem; color: var(--qb-muted); text-align: center; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--qb-line); }
    .qb-col .num.done { background: var(--qb-good-soft); color: var(--qb-good); border-color: transparent; }
    .qb-col .t { font-weight: 600; word-break: break-word; min-width: 0; }
    .qb-col .sub { display: block; font-weight: 400; font-size: .86rem; color: var(--qb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qb-col .mini { display: block; height: 4px; border-radius: 99px; background: var(--qb-line); margin-top: 8px; max-width: 240px; overflow: hidden; }
    .qb-col .mini > span { display: block; height: 100%; background: var(--c, var(--qb-accent)); border-radius: 99px; }
    .qb-col .badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    @media (max-width: 620px) {
      .qb-col .item { grid-template-columns: 42px 1fr; }
      .qb-col .badges { grid-column: 2; justify-content: flex-start; }
      .qb-col .head .meta { margin-left: 0; text-align: left; }
    }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('collection', function (root, data, emit) {
        var esc = QB.esc;
        var c = data.collection || {}, quizzes = data.quizzes || [];
        var total = quizzes.reduce(function (a, q) { return a + q.card_count; }, 0);
        var learned = quizzes.reduce(function (a, q) { return a + q.learned; }, 0);
        var due = quizzes.reduce(function (a, q) { return a + q.due; }, 0);

        root.innerHTML = '<div class="wrap qb-col fade-in">' +
          '<div class="crumbs"><button data-action="back">← Home</button></div>' +
          '<div class="head"><div><div class="kind" style="color:' + esc(c.color || 'var(--qb-accent)') + '">' + esc(c.kind || 'Collection') + '</div><h1>' + esc(c.title) + '</h1>' +
            (c.description ? '<p class="muted" style="margin:0;max-width:60ch">' + esc(c.description) + '</p>' : '') + '</div>' +
            '<div class="meta small muted">' + quizzes.length + (quizzes.length === 1 ? ' quiz' : ' quizzes') + ' · ' + learned + ' of ' + total + ' cards learned' +
              (due ? '<br><span class="badge warn">' + due + ' due today</span>' : '') + '</div></div>' +
          (quizzes.length ? '<div class="list">' + quizzes.map(function (q, i) {
            var all = q.card_count && q.learned === q.card_count;
            var pct = q.card_count ? Math.round(100 * q.learned / q.card_count) : 0;
            var state = q.due ? '<span class="badge warn">' + q.due + ' due</span>'
              : q.new === q.card_count ? '<span class="badge">not started</span>'
              : q.new ? '<span class="badge accent">' + q.new + ' new</span>'
              : '<span class="badge good">up to date</span>';
            return '<button class="card item" data-action="quiz" data-id="' + esc(q.id) + '" style="--c:' + esc(c.color || '') + '">' +
              '<span class="num' + (all ? ' done' : '') + '">' + (all ? '✓' : (i + 1)) + '</span>' +
              '<span class="t">' + esc(q.title) + '<span class="sub">' + esc(q.description || '') + '</span>' +
                '<span class="mini" title="' + q.learned + ' of ' + q.card_count + ' learned"><span style="width:' + pct + '%"></span></span></span>' +
              '<span class="badges">' +
                (q.difficulty ? '<span class="badge">' + esc(q.difficulty) + '</span>' : '') +
                '<span class="badge">' + q.learned + '/' + q.card_count + ' learned</span>' + state +
              '</span></button>';
          }).join('') + '</div>' : '<div class="empty">No quizzes in this collection yet.</div>') +
          '</div>';

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          if (el.dataset.action === 'back') emit('back', {});
          else if (el.dataset.action === 'quiz') emit('open_quiz', { id: el.dataset.id });
        });
        return {};
      });
    })();
    </script>

    <!-- ===== QuizPage component ===== -->
    <style>
    .qb-study .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .9rem; color: var(--qb-muted); }
    .qb-study .qhead .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qb-study .counts { display: flex; gap: 6px; flex-wrap: wrap; }
    .qb-study .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .qb-study .how > div { padding: 12px 14px; border: 1px solid var(--qb-line); border-radius: 12px; background: var(--qb-panel-2); font-size: .9rem; }
    .qb-study .how b { display: block; margin-bottom: 2px; }
    .qb-study .flash { padding: 0; overflow: hidden; }
    .qb-study .front { padding: 30px 30px 26px; }
    .qb-study .front.clickable { cursor: pointer; }
    .qb-study .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 24px; }
    .qb-study .level { display: inline-flex; gap: 3px; margin-left: auto; }
    .qb-study .level i { width: 7px; height: 7px; border-radius: 50%; background: var(--qb-line); }
    .qb-study .level i.on { background: var(--qb-accent); }
    .qb-study .qtext { font-family: var(--qb-serif); font-size: 1.55rem; line-height: 1.35; margin: 18px 0 4px; }
    .qb-study .reveal { display: flex; justify-content: center; margin-top: 22px; }
    .qb-study .reveal .btn { padding: 12px 26px; font-size: 1rem; }
    .qb-study .back { border-top: 1px dashed var(--qb-line); background: var(--qb-panel-2); padding: 22px 30px 26px; animation: qb-slide .28s ease-out; }
    @keyframes qb-slide { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .qb-study .back .lbl { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--qb-accent); font-weight: 700; }
    .qb-study .answer { font-family: var(--qb-serif); font-size: 1.3rem; line-height: 1.4; margin: 6px 0 0; }
    .qb-study .expl { color: var(--qb-muted); margin-top: 10px; }
    .qb-study .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .qb-study .rate .btn { padding: 13px 14px; font-size: 1rem; font-weight: 600; flex-direction: column; gap: 2px; }
    .qb-study .rate .btn small { font-weight: 400; font-size: .78rem; opacity: .8; }
    .qb-study .rate .again { border-color: var(--qb-warn); color: var(--qb-warn); background: var(--qb-warn-soft); }
    .qb-study .rate .got { border-color: var(--qb-good); color: var(--qb-panel); background: var(--qb-good); }
    .qb-study .rate .again:hover, .qb-study .rate .got:hover { filter: brightness(1.06); }
    .qb-study .keys { font-size: .8rem; color: var(--qb-muted); margin-top: 12px; text-align: center; }
    .qb-study kbd { font: inherit; font-size: .75rem; border: 1px solid var(--qb-line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--qb-panel); }
    .qb-study .big { font-family: var(--qb-serif); font-size: 3rem; font-weight: 700; line-height: 1; }
    .qb-study .split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--qb-line); margin: 12px 0 6px; }
    .qb-study .split .g { background: var(--qb-good); } .qb-study .split .a { background: var(--qb-warn); }
    .qb-study .list { display: grid; gap: 8px; }
    .qb-study .list details { border: 1px solid var(--qb-line); border-radius: 12px; padding: 11px 14px; background: var(--qb-panel-2); }
    .qb-study .list summary { cursor: pointer; font-weight: 600; }
    .qb-study .done-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 1.6rem; background: var(--qb-good-soft); color: var(--qb-good); }
    @media (max-width: 620px) {
      .qb-study .front, .qb-study .back { padding-left: 20px; padding-right: 20px; }
      .qb-study .qtext { font-size: 1.3rem; } .qb-study .how { grid-template-columns: 1fr; } .qb-study .keys { display: none; }
    }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('quiz', function (root, data, emit) {
        var esc = QB.esc;
        var REQUEUE_GAP = 3;   // a "still learning" card returns after this many other cards
        var MAX_REPEATS = 2;   // ...at most this many extra times per session
        var S;

        function reset(d) {
          data = d;
          S = { screen: 'intro', shuffle: S ? S.shuffle : false, queue: [], ratings: [], seen: {}, repeats: {},
                revealed: false, card: null, total: 0, save: Promise.resolve(), saveFailed: false };
        }
        reset(data);

        root.innerHTML = '<div class="wrap qb-study"><div class="narrow" data-el="view"></div></div>';
        var view = root.querySelector('[data-el=view]');
        var quiz = function () { return data.quiz || {}; };

        function crumbs() {
          return '<div class="crumbs"><button data-action="back">← ' + esc(quiz().collection_title || 'Back') + '</button></div>';
        }
        function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
        function dueText(iso, count) {
          if (!iso) return '';
          var days = Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
          var when = days <= 0 ? 'today' : days === 1 ? 'tomorrow' : days < 7 ? 'in ' + days + ' days' : 'on ' + QB.fmtDate(iso + 'T12:00:00');
          return count ? plural(count, 'card') + ' due ' + when : 'Next card due ' + when;
        }

        // ---------------------------------------------------------------- intro
        function renderIntro() {
          S.screen = 'intro';
          var q = quiz(), c = data.counts || {}, cards = data.cards || [], mixed = !q.id;
          var nNew = cards.filter(function (x) { return x.is_new; }).length, nRev = cards.length - nNew;
          var html = crumbs() + '<div class="card pad stack fade-in">' +
            '<div><div class="kind">' + esc(mixed ? 'Spaced repetition' : q.collection_title) + '</div><h1>' + esc(q.title) + '</h1>' +
            (q.description ? '<p class="muted">' + esc(q.description) + '</p>' : '') +
            (!mixed ? '<div class="counts">' +
              '<span class="badge">' + plural(c.total || 0, 'card') + '</span>' +
              '<span class="badge good">' + (c.learned || 0) + ' learned</span>' +
              (c.due ? '<span class="badge warn">' + c.due + ' due</span>' : '') +
              (c.new ? '<span class="badge accent">' + c.new + ' new</span>' : '') + '</div>' : '') + '</div>';
          if (cards.length) {
            html += '<div class="how">' +
                '<div><b>1. Recall</b>Read the question and answer it in your head.</div>' +
                '<div><b>2. Reveal</b>Click the card (or press Space) to see the answer.</div>' +
                '<div><b>3. Be honest</b>"Got it" pushes the card further out. "Still learning" keeps it coming back.</div>' +
              '</div>' +
              '<label class="toggle"><input type="checkbox" data-el="shuffle"' + (S.shuffle ? ' checked' : '') + '><span><strong>Shuffle cards</strong><br><span class="muted small">Mix up the order instead of following the quiz.</span></span></label>' +
              '<div class="row"><button class="btn primary" data-action="start">Start · ' + plural(cards.length, 'card') + '</button>' +
              '<span class="muted small">' + [nRev ? nRev + ' to review' : '', nNew ? nNew + ' new' : ''].filter(Boolean).join(' · ') +
              (c.limit && cards.length >= c.limit ? ' (session limit)' : '') + '</span></div>';
          } else {
            html += '<div class="row" style="gap:14px"><div class="done-ico">✓</div><div><h3 style="margin:0">All caught up</h3>' +
              '<div class="muted">' + esc(c.next_due ? dueText(c.next_due) + '.' : 'Nothing is due.') + '</div></div></div>' +
              '<div class="row">' + (!mixed && c.total ? '<button class="btn primary" data-action="all">Study all ' + plural(c.total, 'card') + ' anyway</button>' : '') +
              '<button class="btn ghost" data-action="back">Back</button></div>';
          }
          view.innerHTML = html + '</div>';
        }

        // ---------------------------------------------------------------- session
        function start(cards) {
          var shuffleBox = view.querySelector('[data-el=shuffle]');
          if (shuffleBox) S.shuffle = shuffleBox.checked;
          S.byId = S.byId || {};
          S.queue = (S.shuffle ? QB.shuffle(cards) : cards.slice()).map(function (c) {
            return (S.byId[c.id] = S.byId[c.id] || Object.assign({}, c)); // one live copy per card, so levels carry over
          });
          S.total = S.queue.length; S.ratings = []; S.seen = {}; S.repeats = {};
          next();
        }

        function next() {
          S.card = S.queue.shift();
          S.revealed = false;
          if (!S.card) return finish();
          S.screen = 'card';
          renderCard();
        }

        function remaining() {
          var ids = {}; if (S.card) ids[S.card.id] = 1;
          S.queue.forEach(function (c) { ids[c.id] = 1; });
          return Object.keys(ids).length;
        }

        function renderCard() {
          var c = S.card, left = remaining(), done = S.total - left;
          var dots = ''; for (var i = 1; i <= 5; i++) dots += '<i class="' + (c.box >= i ? 'on' : '') + '"></i>';
          view.innerHTML = '<div class="qhead"><button class="btn sm ghost" data-action="stop">✕ ' + (S.ratings.length ? 'Finish' : 'Stop') + '</button>' +
              '<span class="title">' + esc(quiz().title) + '</span><span class="spacer"></span><span>' + left + ' left</span></div>' +
            '<div class="bar" style="margin-bottom:14px"><span style="width:' + (100 * done / Math.max(1, S.total)) + '%"></span></div>' +
            '<div class="card flash fade-in">' +
              '<div class="front' + (S.revealed ? '' : ' clickable') + '" data-action="' + (S.revealed ? '' : 'reveal') + '">' +
                '<div class="meta">' + (c.concept ? '<span class="badge accent">' + esc(c.concept) + '</span>' : '') +
                  (c.quiz_title ? '<span class="badge">' + esc(c.quiz_title) + '</span>' : '') +
                  (c.is_new && !S.seen[c.id] ? '<span class="badge warn">new</span>' : '') +
                  (S.repeats[c.id] ? '<span class="badge">again</span>' : '') +
                  '<span class="level" title="How well you know this card">' + dots + '</span></div>' +
                '<div class="qtext">' + esc(c.text) + '</div>' +
                (!S.revealed ? '<div class="reveal"><button class="btn primary" data-action="reveal">Show answer</button></div>' : '') +
              '</div>' +
              (S.revealed ? '<div class="back"><div class="lbl">Answer</div><div class="answer">' + esc(c.answer) + '</div>' +
                (c.explanation ? '<div class="expl">' + esc(c.explanation) + '</div>' : '') +
                '<div class="rate"><button class="btn again" data-action="rate" data-knew="0">↺ Still learning<small>keep it in rotation</small></button>' +
                '<button class="btn got" data-action="rate" data-knew="1">✓ Got it<small>' + esc(gapText(c)) + '</small></button></div></div>' : '') +
            '</div>' +
            '<div class="keys">' + (S.revealed ? '<kbd>1</kbd> still learning · <kbd>2</kbd> got it' : '<kbd>Space</kbd> show answer') + '</div>';
        }

        var GAPS = [0, 1, 3, 7, 16, 35, 90]; // keep in sync with BOX_INTERVALS in QuizService
        function gapText(c) {
          var d = GAPS[Math.min((c.box || 0) + 1, GAPS.length - 1)];
          return 'see it again in ' + (d === 1 ? '1 day' : d + ' days');
        }

        function reveal() { if (S.screen === 'card' && !S.revealed) { S.revealed = true; renderCard(); } }

        function rate(knew) {
          if (S.screen !== 'card' || !S.revealed) return;
          var c = S.card;
          S.ratings.push({ question_id: c.id, knew: knew, first: !S.seen[c.id] });
          S.seen[c.id] = true;
          // Save each rating as it happens, one after another.
          S.save = S.save.then(function () { return emit('rate', { question_id: c.id, knew: knew }); })
            .then(function (res) { if (res && res.box != null) c.box = res.box; }, function (err) {
              if (!S.saveFailed) QB.toast('Could not save a rating: ' + (err && err.message || err), true);
              S.saveFailed = true;
            });
          if (knew) c.box = Math.min((c.box || 0) + 1, 6);
          else {
            c.box = 0;
            if ((S.repeats[c.id] || 0) < MAX_REPEATS) {
              S.repeats[c.id] = (S.repeats[c.id] || 0) + 1;
              S.queue.splice(Math.min(REQUEUE_GAP, S.queue.length), 0, c);
            }
          }
          next();
        }

        // ---------------------------------------------------------------- summary
        function finish() {
          S.screen = 'done';
          if (!S.ratings.length) { renderIntro(); return; }
          var last = {}, first = {}, order = [];
          S.ratings.forEach(function (r) {
            if (!(r.question_id in first)) { first[r.question_id] = r.knew; order.push(r.question_id); }
            last[r.question_id] = r.knew;
          });
          var byId = S.byId;
          var n = order.length;
          var firstTry = order.filter(function (id) { return first[id]; }).length;
          var still = order.filter(function (id) { return !last[id]; });
          var recovered = n - firstTry - still.length;
          S.still = still.map(function (id) { return byId[id]; });

          view.innerHTML = crumbs() + '<div class="card pad stack fade-in">' +
            '<div class="muted small">' + esc(quiz().title) + ' · session complete</div>' +
            '<div class="row" style="gap:18px;align-items:flex-end"><div class="big">' + n + '</div><div style="padding-bottom:4px">' + (n === 1 ? 'card' : 'cards') + ' reviewed</div>' +
              '<span class="spacer"></span><div data-el="gains" class="row" style="gap:6px"><span class="badge"><span class="spin"></span> saving…</span></div></div>' +
            '<div><div class="split"><span class="g" style="width:' + (100 * (n - still.length) / n) + '%"></span><span class="a" style="width:' + (100 * still.length / n) + '%"></span></div>' +
              '<div class="row small"><span><span class="badge good">' + firstTry + ' got it first time</span></span>' +
              (recovered ? '<span class="badge accent">' + recovered + ' after another look</span>' : '') +
              (still.length ? '<span class="badge warn">' + still.length + ' still learning</span>' : '') + '</div></div>' +
            '<p data-el="next" class="muted"></p>' +
            '<div class="row">' + (S.still.length ? '<button class="btn primary" data-action="again">Go again with the ' + plural(S.still.length, 'card') + ' I\'m still learning</button>' : '') +
              '<button class="btn' + (S.still.length ? '' : ' primary') + '" data-action="back">Done</button></div>' +
            (S.still.length ? '<h3 style="margin-top:18px">Still in rotation</h3><div class="list">' + S.still.map(function (c) {
              return '<details><summary>' + esc(c.text) + '</summary><div style="margin-top:8px"><strong>' + esc(c.answer) + '</strong>' +
                (c.explanation ? '<div class="muted small" style="margin-top:4px">' + esc(c.explanation) + '</div>' : '') + '</div></details>';
            }).join('') + '</div>' : '') +
            '</div>';

          var ratings = S.ratings.map(function (r) { return { question_id: r.question_id, knew: r.knew, first: r.first }; });
          S.save.then(function () { return emit('finish', { quiz_id: quiz().id || null, ratings: ratings }); }).then(function (res) {
            res = res || {};
            var g = view.querySelector('[data-el=gains]');
            if (g) g.innerHTML = (res.xp_gained ? '<span class="badge accent">+' + res.xp_gained + ' XP</span>' : '') +
              (res.streak ? '<span class="badge warn">🔥 ' + res.streak + '-day streak</span>' : '') || '<span class="badge good">Saved</span>';
            var nx = view.querySelector('[data-el=next]');
            if (nx) nx.textContent = still.length ? 'Cards you are still learning stay due, so they will be in your next review.'
              : res.next_due ? dueText(res.next_due) + '. Come back then to keep the streak going.' : '';
          }, function (err) {
            var g = view.querySelector('[data-el=gains]');
            if (g) g.innerHTML = '<span class="badge bad">Session not saved</span>';
            QB.toast('Could not save the session: ' + (err && err.message || err), true);
          });
        }

        // ---------------------------------------------------------------- events
        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el || !root.contains(el) || !el.dataset.action) return;
          var a = el.dataset.action;
          if (a === 'start') start(data.cards || []);
          else if (a === 'reveal') reveal();
          else if (a === 'rate') rate(el.dataset.knew === '1');
          else if (a === 'stop') { if (S.ratings.length) { S.queue = []; finish(); } else renderIntro(); }
          else if (a === 'again') start(S.still);
          else if (a === 'back') emit('back', {});
          else if (a === 'all') {
            el.disabled = true; el.innerHTML = '<span class="spin"></span>';
            emit('load', { scope: 'all' }).then(function (d) { reset(d); renderIntro(); start(data.cards || []); },
              function (err) { QB.toast(String(err && err.message || err), true); renderIntro(); });
          }
        });

        function onKey(e) {
          if (!document.body.contains(root)) { document.removeEventListener('keydown', onKey); return; }
          if (S.screen !== 'card' || e.ctrlKey || e.metaKey || e.altKey) return;
          if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
          if (!S.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
          else if (S.revealed && e.key === '1') { e.preventDefault(); rate(false); }
          else if (S.revealed && e.key === '2') { e.preventDefault(); rate(true); }
          else if (S.revealed && (e.key === ' ' || e.key === 'Enter')) e.preventDefault(); // no accidental clicks
        }
        document.addEventListener('keydown', onKey);

        renderIntro();
        return { destroy: function () { document.removeEventListener('keydown', onKey); } };
      });
    })();
    </script>

    <!-- ===== ProfilePage component ===== -->
    <style>
