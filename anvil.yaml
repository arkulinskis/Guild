    <!-- ===== Main component ===== -->
    <style>
    .qb-header { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--qb-bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 3px solid var(--qb-red); border-bottom: 1px solid var(--qb-line); }
    .qb-header .in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 18px; }
    .qb-header .brand { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--qb-ink); }
    .qb-header .brand .name { font-family: var(--qb-serif); font-weight: 700; font-size: 1.35rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
    .qb-header .brand .sub { display: block; font-family: var(--qb-sans); font-size: .72rem; letter-spacing: .04em; text-transform: none; color: var(--qb-muted); font-weight: 500; margin-top: 3px; }
    .qb-header .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--qb-hero); color: var(--qb-red); display: grid; place-items: center; overflow: hidden; flex: none; }
    .qb-header .logo img { width: 100%; height: 100%; object-fit: cover; }
    .qb-header .logo .leaf { width: 22px; height: 22px; color: #fff; }
    .qb-header nav { display: flex; gap: 4px; margin-left: auto; }
    .qb-header nav button { all: unset; cursor: pointer; color: var(--qb-muted); padding: 6px 11px; border-radius: 8px; font-size: .95rem; }
    .qb-header nav button.on, .qb-header nav button:hover { color: var(--qb-ink); background: var(--qb-panel); }
    .qb-header .me { position: relative; }
    .qb-header .me > button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; border-radius: 99px; padding: 2px; }
    .qb-header .me > button:focus-visible { outline: 2px solid var(--qb-accent); }
    .qb-header .xp { font-size: .8rem; color: var(--qb-muted); }
    .qb-header .menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; padding: 6px; z-index: 60; }
    .qb-header .menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--qb-line); margin-bottom: 4px; }
    .qb-header .menu button { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 8px 10px; border-radius: 8px; font-size: .93rem; }
    .qb-header .menu button:hover { background: var(--qb-panel-2); }
    .qb-header .guest { max-width: 980px; margin: 0 auto; padding: 6px 16px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: .85rem; color: var(--qb-muted); }
    .qb-header .guest strong { color: var(--qb-ink); }
    .qb-header .guest button { all: unset; cursor: pointer; color: var(--qb-accent); font-weight: 600; }
    .qb-header .guest button:hover { text-decoration: underline; }
    .qb-page { min-height: calc(100vh - 120px); }
    .qb-signed-out .qb-page { min-height: 0; }
    .qb-footer { max-width: 980px; margin: 0 auto; padding: 18px 16px 28px; border-top: 1px solid var(--qb-line); color: var(--qb-muted); font-size: .8rem; text-align: center; line-height: 1.5; }
    .qb-footer strong { color: var(--qb-ink); font-weight: 600; }
    .qb-header nav button.look { display: inline-flex; align-items: center; gap: 5px; }
    .qb-header nav button.look svg { width: 16px; height: 16px; flex: none; }
    .qb-dict { position: fixed; z-index: 70; top: var(--qb-dict-top, 64px); right: max(16px, calc((100vw - 980px) / 2 + 16px)); width: min(420px, calc(100vw - 32px)); box-sizing: border-box; max-height: calc(100vh - var(--qb-dict-top, 64px) - 16px); display: flex; flex-direction: column; padding: 14px; background: var(--qb-panel); border: 1px solid var(--qb-line); border-radius: var(--qb-radius); box-shadow: 0 12px 40px rgba(16,24,40,.22); }
    .qb-dict[hidden] { display: none; }
    .qb-dict .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .qb-dict .top strong { font-family: var(--qb-serif); font-size: 1.15rem; letter-spacing: .03em; text-transform: uppercase; }
    .qb-dict .top button { all: unset; cursor: pointer; color: var(--qb-muted); font-size: 1.3rem; line-height: 1; padding: 2px 6px; border-radius: 6px; }
    .qb-dict .top button:hover { color: var(--qb-ink); background: var(--qb-panel-2); }
    .qb-dict input { box-sizing: border-box; width: 100%; font: inherit; font-size: 1rem; padding: 9px 11px; border: 1px solid var(--qb-line); border-radius: 10px; background: var(--qb-panel-2); color: var(--qb-ink); }
    .qb-dict .res { overflow-y: auto; margin: 10px 0 4px; min-height: 0; }
    .qb-dict .hit { padding: 8px 2px; border-bottom: 1px solid var(--qb-line); }
    .qb-dict .hit:last-child { border-bottom: 0; }
    .qb-dict .hit b { color: var(--qb-accent); font-weight: 700; margin-right: 6px; }
    .qb-dict .hit .src { display: block; font-size: .78rem; color: var(--qb-muted); margin-top: 2px; }
    .qb-dict .note { font-size: .88rem; color: var(--qb-muted); padding: 6px 2px; }
    .qb-dict .google { margin-top: 8px; }
    .qb-dict .google[hidden] { display: none; }
    @media (max-width: 520px) { .qb-header nav button.look span { display: none; } .qb-header nav button { padding: 6px 8px; } }
    @media (max-width: 520px) { .qb-header .xp, .qb-header .brand .sub { display: none; } .qb-header .brand .name { font-size: 1.1rem; } .qb-header .in { gap: 10px; } }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('header', function (root, data, emit) {
        var esc = QB.esc;
        var S = { user: data.user || null, active: data.active || 'home', open: false, appName: data.app_name || 'CAF Guide', logo: data.logo_url || '' };

        // ---- Lookup: a small abbreviation dictionary. It lives outside the header so re-rendering the
        // header never steals focus from the search box.
        var dict = document.createElement('div');
        dict.className = 'qb qb-dict card fade-in';
        dict.hidden = true;
        dict.setAttribute('role', 'dialog');
        dict.setAttribute('aria-label', 'Look up an abbreviation');
        dict.innerHTML = '<div class="top"><strong>Lookup</strong><button type="button" data-action="close" aria-label="Close">×</button></div>' +
          '<input type="search" placeholder="Abbreviation or words, e.g. CJOC or LGen" autocomplete="off" spellcheck="false" aria-label="Abbreviation to look up">' +
          '<div class="res" aria-live="polite"></div>' +
          '<a class="btn sm block google" target="_blank" rel="noopener"></a>';
        document.body.appendChild(dict);
        var dInput = dict.querySelector('input'), dRes = dict.querySelector('.res'), dGoogle = dict.querySelector('.google');
        var ROWS = window.QB_ACRONYMS || [], MODS = window.QB_ACRONYM_MODULES || {};
        function squash(t) { return String(t).toLowerCase().replace(/[^a-z0-9]/g, ''); }

        function lookup(q) {
          var k = squash(q), w = q.trim().toLowerCase(), exact = [], prefix = [], words = [];
          if (!k) return [];
          ROWS.forEach(function (r) {
            var a = squash(r[0]);
            if (a === k) exact.push(r);
            else if (a.indexOf(k) === 0) prefix.push(r);
            else if (w.length >= 3 && r[1].toLowerCase().indexOf(w) >= 0) words.push(r);
          });
          prefix.sort(function (x, y) { return x[0].length - y[0].length; });
          return exact.concat(prefix, words).slice(0, 30);
        }

        function drawDict() {
          var q = dInput.value.trim(), hits = lookup(q);
          if (!q) {
            dRes.innerHTML = '<div class="note">Type an abbreviation to see what it stands for. The list holds the ' + ROWS.length +
              ' abbreviations found in this guide\'s study materials.</div>';
          } else if (!hits.length) {
            dRes.innerHTML = '<div class="note">“' + esc(q) + '” isn\'t in this guide\'s list. Try a web search instead.</div>';
          } else {
            dRes.innerHTML = hits.map(function (r) {
              var src = r[2].map(function (n) { return MODS[n] ? 'Module ' + n + ': ' + MODS[n] : ''; }).filter(Boolean);
              return '<div class="hit"><b>' + esc(r[0]) + '</b>' + esc(r[1]) +
                (src.length ? '<span class="src">' + esc(src.slice(0, 2).join(' · ') + (src.length > 2 ? ' · +' + (src.length - 2) + ' more' : '')) + '</span>' : '') + '</div>';
            }).join('');
          }
          dGoogle.hidden = !q;
          dGoogle.href = 'https://www.google.com/search?q=' + encodeURIComponent(q + ' CAF');
          dGoogle.textContent = 'Search Google for “' + q + ' CAF” ↗';
        }

        function openDict(open) {
          dict.hidden = !open;
          if (open) {
            var h = root.querySelector('.qb-header');
            if (h) document.documentElement.style.setProperty('--qb-dict-top', (h.getBoundingClientRect().bottom + 8) + 'px');
            drawDict();
            dInput.focus();
            dInput.select();
          }
          render();
        }

        dInput.addEventListener('input', drawDict);
        dict.addEventListener('keydown', function (e) {
          if (e.key !== 'Escape') return;
          openDict(false);
          var b = root.querySelector('[data-action=lookup]');
          if (b) b.focus();
        });
        dict.addEventListener('click', function (e) {
          e.qbHeader = true; // clicks inside the panel don't close it
          if (e.target.closest('[data-action=close]')) openDict(false);
        });

        function render() {
          var u = S.user;
          document.documentElement.classList.toggle('qb-signed-out', !u);
          if (!u) { dict.hidden = true; root.innerHTML = ''; return; } // no top bar until signed in
          root.innerHTML = '<header class="qb-header"><div class="in">' +
            '<button class="brand" data-action="nav" data-page="home"><span class="logo">' + (S.logo ? '<img alt="" src="' + esc(S.logo) + '">' : QB.leaf()) + '</span>' +
              '<span><span class="name">' + esc(S.appName) + '</span><span class="sub">Unofficial CAF study guide · made by a civilian</span></span></button>' +
            (u ? '<nav>' +
                '<button data-action="lookup" class="look' + (dict.hidden ? '' : ' on') + '" title="Look up an abbreviation" aria-label="Look up an abbreviation" aria-expanded="' + !dict.hidden + '">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg><span>Lookup</span></button>' +
              '</nav>' +
              '<div class="me"><button data-action="menu" aria-haspopup="true" aria-expanded="' + S.open + '">' +
                '<span class="xp">' + (u.xp || 0) + ' XP' + (u.streak ? ' · 🔥 ' + u.streak : '') + '</span>' + QB.avatar(u) + '</button>' +
                (S.open ? '<div class="menu card fade-in"><div class="who"><strong>' + esc(u.display_name) + '</strong><div class="muted small">' + (u.guest ? 'Guest · nothing is saved' : esc(u.email)) + '</div></div>' +
                  '<button data-action="nav" data-page="profile">Your profile</button>' +
                  '<button data-action="signout">' + (u.guest ? 'Exit guest mode' : 'Sign out') + '</button></div>' : '') +
              '</div>' : '') +
            '</div>' +
            (u.guest ? '<div class="guest"><span><strong>Guest mode.</strong> Your progress is kept only until you close this tab.</span>' +
              '<button data-action="signout">Sign in or create an account</button></div>' : '') +
            '</header>';
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          e.qbHeader = true; // tells the outside-click handler below to ignore this click
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'menu') { S.open = !S.open; dict.hidden = true; render(); return; }
          if (a === 'lookup') { S.open = false; openDict(dict.hidden); return; }
          S.open = false;
          dict.hidden = true;
          if (a === 'nav') { S.active = el.dataset.page; render(); emit('nav', { page: el.dataset.page }); }
          else if (a === 'signout') { render(); emit('signout', {}); }
        });
        document.addEventListener('click', function (e) {
          if (e.qbHeader) return;
          if (S.open) { S.open = false; render(); }
          if (!dict.hidden) openDict(false);
        });

        // The sign-in page fills the screen minus the footer, so the disclaimer is visible without scrolling.
        var foot = document.querySelector('.qb-footer');
        if (foot && window.ResizeObserver) {
          new ResizeObserver(function () {
            document.documentElement.style.setProperty('--qb-foot-h', foot.offsetHeight + 'px');
          }).observe(foot);
        }

        render();
        return {
          setUser: function (json) { S.user = json ? JSON.parse(json) : null; render(); },
          setActive: function (page) { S.active = page; S.open = false; render(); }
        };
      });
    })();
    </script>

