    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('auth', function (root, data, emit) {
        var esc = QB.esc;
        var S = { mode: 'login', busy: false, msg: null, email: '' };

        function form() {
          if (S.mode === 'reset') {
            return '<h2>Reset your password</h2><p class="muted small">We\'ll email you a link to choose a new one.</p>' +
              '<form data-form="reset"><div><label class="f" for="qbE">Email</label><input type="email" id="qbE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><button class="btn primary block" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>' : 'Send reset link') + '</button></div></form>' +
              '<p style="margin-top:14px"><button class="link" data-action="mode" data-mode="login">← Back to sign in</button></p>';
          }
          var signup = S.mode === 'signup';
          return '<div class="tabs" role="tablist">' +
              '<button role="tab" data-action="mode" data-mode="login" class="' + (!signup ? 'on' : '') + '">Sign in</button>' +
              '<button role="tab" data-action="mode" data-mode="signup" class="' + (signup ? 'on' : '') + '">Create account</button></div>' +
            '<h2>' + (signup ? 'Create your account' : 'Welcome back') + '</h2>' +
            '<p class="muted small">' + (signup ? 'Your progress, streak and cards learned are saved to your profile.' : 'Sign in to continue where you left off.') + '</p>' +
            '<form data-form="' + S.mode + '">' +
              (signup ? '<div><label class="f" for="qbN">Your name</label><input type="text" id="qbN" name="name" required autocomplete="name" placeholder="How should we greet you?"></div>' : '') +
              '<div><label class="f" for="qbE">Email</label><input type="email" id="qbE" name="email" required autocomplete="email" value="' + esc(S.email) + '"></div>' +
              '<div><label class="f" for="qbP">Password</label><input type="password" id="qbP" name="password" required minlength="' + (signup ? 8 : 1) + '" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
                (signup ? '<div class="hint">At least 8 characters.</div>' : '<div class="hint" style="text-align:right"><button type="button" class="link" data-action="mode" data-mode="reset">Forgot password?</button></div>') + '</div>' +
              '<div><button class="btn primary block" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '<span class="spin"></span>' : signup ? 'Create account' : 'Sign in') + '</button></div>' +
            '</form>' +
            (data.google ? '<div class="or">or</div><button class="btn block" data-action="google"' + (S.busy ? ' disabled' : '') + '>Continue with Google</button>' : '') +
            '<div class="or">or</div><button class="btn block" data-action="guest"' + (S.busy ? ' disabled' : '') + '>Try it without signing in</button>' +
            '<p class="hint guest-note">Everything works, but your progress is only kept until you close this tab.</p>';
        }

        function render() {
          root.innerHTML = '<div class="qb-auth">' +
            '<div class="side">' + QB.leaf('wm') +
              '<div class="inner"><div class="badge-logo">' + (data.logo_url ? '<img alt="" src="' + esc(data.logo_url) + '">' : QB.leaf()) + '</div>' +
              '<div class="kind">' + esc(data.app_name || 'CAF Guide') + ' · unofficial study guide</div>' +
              '<h1>' + esc(data.headline || 'Learn about the Canadian Armed Forces') + '</h1>' +
              '<p>' + esc(data.tagline || 'Public reports, policies, doctrine and history about the CAF, turned into flashcards that come back just before you would forget them.') + '</p>' +
              '<ul><li>' + esc(data.module_line || 'Learning modules you work through one by one') + '</li><li>Answer in your head, then reveal the answer</li><li>Track cards learned, modules completed and your streak</li></ul>' +
              '<div class="civ"><strong>Made by a civilian, for learning.</strong> This is a personal study project by someone interested in the field. It is not an official CAF or DND website and is not endorsed by them.</div></div>' +
              '</div>' +
            '<div class="main"><div class="box fade-in">' + form() + '<div data-el="msg"></div></div></div></div>';
          var f = root.querySelector('form');
          if (f) f.onsubmit = submit;
          showMsg();
          var first = root.querySelector('form input:not([value]), form input[value=""]');
          if (first) first.focus();
        }

        function showMsg() {
          var box = root.querySelector('[data-el=msg]');
          if (box) box.innerHTML = S.msg ? '<div class="feedback ' + (S.msg.ok ? 'good' : 'bad') + '">' + esc(S.msg.text) + '</div>' : '';
        }

        // Toggle the busy state in place so typed values are kept.
        function setBusy(on) {
          S.busy = on;
          root.querySelectorAll('.box button[type=submit], .box [data-action=google], .box [data-action=guest]').forEach(function (b) {
            b.disabled = on;
            if (b.type === 'submit') {
              if (on) { b.dataset.label = b.innerHTML; b.innerHTML = '<span class="spin"></span>'; }
              else if (b.dataset.label) b.innerHTML = b.dataset.label;
            }
          });
        }

        function run(event, payload) {
          if (S.busy) return;
          S.msg = null; showMsg(); setBusy(true);
          emit(event, payload).then(function (res) {
            setBusy(false);
            res = res || {};
            if (res.ok && !res.message) return; // Python navigates away on success
            S.msg = res.ok ? { ok: true, text: res.message } : { ok: false, text: res.error || 'Something went wrong.' };
            if (res.mode && res.mode !== S.mode) { S.mode = res.mode; render(); } else showMsg();
          }, function (err) {
            setBusy(false); S.msg = { ok: false, text: (err && err.message) || String(err) }; showMsg();
          });
        }

        function submit(e) {
          e.preventDefault();
          var fd = new FormData(e.target), v = {};
          fd.forEach(function (val, key) { v[key] = String(val); });
          S.email = v.email || '';
          run(e.target.dataset.form, v);
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          if (el.dataset.action === 'mode') {
            var em = root.querySelector('input[name=email]');
            if (em) S.email = em.value;
            S.mode = el.dataset.mode; S.msg = null; render();
          } else if (el.dataset.action === 'google') run('google', {});
          else if (el.dataset.action === 'guest') run('guest', {});
        });

        render();
        return {};
      });
    })();
    </script>

    <!-- ===== HomePage component ===== -->
    <style>
    .qb-home .hero { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 22px; }
    .qb-home .hero p { margin: 0; }
    .qb-home .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .qb-home .stat { padding: 16px 18px; }
    .qb-home .stat .v { font-family: var(--qb-serif); font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
    .qb-home .stat .k { font-size: .82rem; color: var(--qb-muted); }
    .qb-home .continue { width: 100%; display: flex; gap: 16px; align-items: center; padding: 18px 22px; margin-bottom: 26px; border-color: var(--qb-accent); background: linear-gradient(120deg, var(--qb-accent-soft), var(--qb-panel) 70%); }
    .qb-home .continue.calm { border-color: var(--qb-line); background: var(--qb-panel); cursor: default; }
    .qb-home .continue .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--qb-accent); color: var(--qb-accent-ink); display: grid; place-items: center; font-size: 1.2rem; flex: none; }
    .qb-home section + section { margin-top: 30px; }
    .qb-home .sechead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .qb-home .sechead h2 { margin: 0; font-size: 1.35rem; }
    .qb-home .path-top { padding: 18px 22px; margin-bottom: 14px; }
    .qb-home .path-top .big { font-family: var(--qb-serif); font-size: 2rem; font-weight: 700; line-height: 1; }
    .qb-home .segbar { display: flex; gap: 3px; margin-top: 12px; }
    .qb-home .segbar i { flex: 1; height: 10px; border-radius: 3px; background: var(--qb-line); position: relative; overflow: hidden; }
    .qb-home .segbar i > b { position: absolute; inset: 0 auto 0 0; background: var(--qb-accent); }
    .qb-home .segbar i.done { background: var(--qb-good); }
    .qb-home .segbar i.done > b { background: var(--qb-good); }
    .qb-home .modules { display: grid; gap: 8px; }
    .qb-home .mod { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; transition: border-color .12s, transform .12s; }
    .qb-home .mod:hover { border-color: var(--qb-accent); transform: translateX(2px); }
    .qb-home .mod .num { font-family: var(--qb-serif); font-weight: 700; font-size: 1.35rem; width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; background: var(--qb-panel-2); border: 1px solid var(--qb-line); color: var(--c, var(--qb-accent)); }
    .qb-home .mod.complete .num { background: var(--qb-good-soft); color: var(--qb-good); border-color: transparent; }
    .qb-home .mod .t { font-weight: 600; }
    .qb-home .mod .sub { display: block; font-weight: 400; font-size: .85rem; color: var(--qb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qb-home .mod .mini { display: block; height: 4px; border-radius: 99px; background: var(--qb-line); margin-top: 7px; max-width: 260px; overflow: hidden; }
    .qb-home .mod .mini > span { display: block; height: 100%; background: var(--c, var(--qb-accent)); }
    .qb-home .mod .right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .qb-home .filters { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--qb-line); border-radius: 10px; background: var(--qb-panel-2); margin-left: auto; }
    .qb-home .filters button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 8px; font-size: .85rem; color: var(--qb-muted); }
    .qb-home .filters button.on { background: var(--qb-panel); color: var(--qb-ink); box-shadow: var(--qb-shadow); }
    .qb-home .recent { padding: 6px 0; }
    .qb-home .recent button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 18px; }
    .qb-home .recent button + button { border-top: 1px solid var(--qb-line); }
    .qb-home .recent button:hover { background: var(--qb-panel-2); }
    @media (max-width: 720px) {
      .qb-home .stats { grid-template-columns: repeat(2, 1fr); }
      .qb-home .mod { grid-template-columns: 46px minmax(0, 1fr); }
      .qb-home .mod .num { width: 46px; height: 46px; font-size: 1.15rem; }
      .qb-home .mod .right { grid-column: 2; justify-content: flex-start; }
      .qb-home .filters { margin-left: 0; }
    }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('home', function (root, data, emit) {
        var esc = QB.esc;
        var me = data.me || {}, st = data.stats || {}, mods = data.collections || [], recent = data.recent || [], cont = data.continue;
        var h = new Date().getHours();
        var greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
        var first = String(me.display_name || '').split(/\s+/)[0];
        var filter = 'all';
        try { filter = localStorage.getItem('qb.modFilter') || 'all'; } catch (e) {}

        function statTile(v, k) { return '<div class="card stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }
        function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
        function pad(n) { return (n < 10 ? '0' : '') + n; }
        function when(iso) {
          if (!iso) return '';
          var days = Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
          return days <= 1 ? 'tomorrow' : days < 7 ? 'in ' + days + ' days' : 'on ' + QB.fmtDate(iso + 'T12:00:00');
        }
        function status(m) {
          if (m.complete) return '<span class="badge good">✓ complete</span>';
          if (m.due) return '<span class="badge warn">' + m.due + ' due</span>';
          if (m.started) return '<span class="badge accent">in progress</span>';
          return '<span class="badge">not started</span>';
        }

        var nTotal = st.modules_total || mods.length, nDone = st.modules_complete || 0;

        var contHtml = '';
        if (cont && cont.kind === 'review') {
          contHtml = '<button class="card continue" data-action="review"><span class="ico">↻</span><span style="flex:1;min-width:0"><span class="kind">Due today</span><br>' +
            '<strong style="font-size:1.05rem">' + esc(cont.title) + '</strong><br><span class="muted small">' + esc(cont.subtitle) + '</span></span>' +
            '<span class="badge warn">' + cont.due + '</span></button>';
        } else if (cont) {
          contHtml = '<button class="card continue" data-action="quiz" data-id="' + esc(cont.quiz_id) + '"><span class="ico">▶</span><span style="flex:1;min-width:0"><span class="kind">' +
            (cont.started ? 'Keep going' : 'Start learning') + (cont.module ? ' · Module ' + cont.module : '') + '</span><br>' +
            '<strong style="font-size:1.05rem">' + esc(cont.title) + '</strong><br><span class="muted small">' + esc(cont.subtitle) + '</span></span><span class="badge accent">new</span></button>';
        } else if (st.total_cards) {
          contHtml = '<div class="card continue calm"><span class="ico">✓</span><span><span class="kind">All caught up</span><br><strong>Nothing is due right now.</strong>' +
            (st.next_due ? '<br><span class="muted small">Your next review is ' + esc(when(st.next_due)) + '.</span>' : '') + '</span></div>';
        }

        function modulesHtml() {
          var list = mods.filter(function (m) {
            return filter === 'all' || (filter === 'todo' && !m.complete) || (filter === 'due' && m.due) || (filter === 'done' && m.complete);
          });
          if (!mods.length) return '<div class="empty"><h3>No modules yet</h3><p>Once the learning modules are imported they will show up here.</p></div>';
          if (!list.length) return '<div class="empty">Nothing in this view.</div>';
          return '<div class="modules">' + list.map(function (m) {
            var pct = m.card_count ? Math.round(100 * m.learned / m.card_count) : 0;
            return '<button class="card mod' + (m.complete ? ' complete' : '') + '" data-action="col" data-id="' + esc(m.id) + '" style="--c:' + esc(m.color || '') + '">' +
              '<span class="num">' + (m.complete ? '✓' : pad(m.number || 0)) + '</span>' +
              '<span style="min-width:0"><span class="t">' + esc(m.title) + '</span><span class="sub">' + esc(m.description || '') + '</span>' +
                '<span class="mini" title="' + m.learned + ' of ' + m.card_count + ' cards learned"><span style="width:' + pct + '%"></span></span></span>' +
              '<span class="right"><span class="badge">' + m.learned + '/' + m.card_count + '</span>' + status(m) + '</span>' +
              '</button>';
          }).join('') + '</div>';
        }

        function render() {
          root.innerHTML = '<div class="wrap qb-home fade-in">' +
            '<div class="hero"><div><div class="kind">Canadian Armed Forces · unofficial study guide</div><h1>' + greet + (first ? ', ' + esc(first) : '') + '</h1>' +
              '<p class="muted">' + (st.due ? 'You have ' + plural(st.due, 'card') + ' to review today.'
                : nTotal ? 'Work through ' + nTotal + ' learning modules about the Canadian Armed Forces, one card at a time.'
                : 'The learning modules will appear here once they are imported.') + '</p></div></div>' +
            '<div class="stats">' +
              statTile(nDone + '<span class="muted" style="font-size:1rem"> / ' + nTotal + '</span>', 'modules complete') +
              statTile((st.learned || 0) + '<span class="muted" style="font-size:1rem"> / ' + (st.total_cards || 0) + '</span>', 'cards learned') +
              statTile(st.due || 0, 'due today') +
              statTile((st.streak || 0) + (st.streak ? ' 🔥' : ''), 'day streak') +
            '</div>' + contHtml +
            '<section><div class="sechead"><h2>Your learning path</h2><span class="muted small">' + plural(nTotal, 'module') + '</span>' +
              '<div class="filters">' + [['all', 'All'], ['todo', 'To do'], ['due', 'Due'], ['done', 'Complete']].map(function (f) {
                return '<button data-action="filter" data-f="' + f[0] + '" class="' + (filter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
              }).join('') + '</div></div>' +
              (mods.length ? '<div class="card path-top"><div class="row"><span class="big">' + nDone + ' of ' + nTotal + '</span><span class="muted">modules complete · ' +
                (st.modules_started || 0) + ' started</span><span class="spacer"></span><span class="muted small">A module is complete when every card has been marked "Got it".</span></div>' +
                '<div class="segbar" aria-hidden="true">' + mods.map(function (m) {
                  var pct = m.card_count ? Math.round(100 * m.learned / m.card_count) : 0;
                  return '<i class="' + (m.complete ? 'done' : '') + '" title="Module ' + m.number + ': ' + pct + '%"><b style="width:' + (m.complete ? 100 : pct) + '%"></b></i>';
                }).join('') + '</div></div>' : '') +
              '<div data-el="mods">' + modulesHtml() + '</div>' +
            '</section>' +
            (recent.length ? '<section><div class="sechead"><h2>Recent sessions</h2></div><div class="card recent">' + recent.map(function (r) {
              var action = r.quiz_id ? 'quiz' : r.collection_id ? 'col' : 'review';
              return '<button data-action="' + action + '" data-id="' + esc(r.quiz_id || r.collection_id || '') + '"><span><strong>' + esc(r.title) + '</strong><br><span class="muted small">' + esc(r.collection_title) + ' · ' + esc(QB.fmtDate(r.finished)) + '</span></span>' +
                '<span class="row" style="gap:6px"><span class="badge">' + plural(r.reviewed, 'card') + '</span>' + (r.again ? '<span class="badge warn">' + r.again + ' still learning</span>' : '<span class="badge good">all got it</span>') + '</span></button>';
            }).join('') + '</div></section>' : '') +
            '</div>';
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'col') emit('open_collection', { id: el.dataset.id });
          else if (a === 'quiz') emit('open_quiz', { id: el.dataset.id });
          else if (a === 'review') emit('open_review', {});
          else if (a === 'filter') {
            filter = el.dataset.f;
            try { localStorage.setItem('qb.modFilter', filter); } catch (err) {}
            root.querySelectorAll('.filters button').forEach(function (b) { b.classList.toggle('on', b === el); });
            root.querySelector('[data-el=mods]').innerHTML = modulesHtml();
          }
        });
        render();
        return {};
      });
    })();
    </script>

    <!-- ===== CollectionPage component ===== -->
    <style>
    .qb-col .head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 18px; }
    .qb-col .head h1 { margin-bottom: 6px; }
    .qb-col .modnum { display: inline-flex; align-items: center; gap: 8px; }
    .qb-col .modnum b { font-family: var(--qb-serif); font-size: 1.05rem; color: var(--c, var(--qb-accent)); }
    .qb-col .src { font-size: .85rem; margin-top: 6px; overflow-wrap: anywhere; }
    .qb-col .summary { padding: 16px 20px; margin-bottom: 16px; }
