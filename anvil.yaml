    <script>
    (function () {
      var QB = window.QB;
      QB.define('profile', function (root, data, emit) {
        var esc = QB.esc;
        var me = data.me || {}, st = data.stats || {}, prog = data.progress || [], hist = data.history || [];
        var colors = data.colors || ['#2f6f62', '#3b5bdb', '#7048e8', '#c2255c', '#e8590c', '#2b8a3e', '#1c7ed6', '#5c5f66'];
        var S = { color: me.avatar_color || colors[0], saving: false };
        var theme = 'auto';
        try { theme = localStorage.getItem('qb.theme') || 'auto'; } catch (e) {}

        function render() {
          root.innerHTML = '<div class="wrap qb-prof fade-in">' +
            '<div class="top">' + QB.avatar(Object.assign({}, me, { avatar_color: S.color }), 'lg') +
              '<div><h1>' + esc(me.display_name) + '</h1><div class="muted small">' + esc(me.email) +
              (me.signed_up ? ' · member since ' + esc(QB.fmtDate(me.signed_up)) : '') + (me.is_admin ? ' · <span class="badge accent">admin</span>' : '') + '</div>' +
              (me.bio ? '<p style="margin:6px 0 0;max-width:60ch">' + esc(me.bio) + '</p>' : '') + '</div>' +
              '<span class="spacer"></span><button class="btn" data-action="signout">Sign out</button></div>' +

            '<div class="cols"><div>' +
              '<div class="card pad stack"><h2>Your stats</h2><div class="stats">' +
                tile((st.learned || 0) + '<span class="muted" style="font-size:.9rem"> / ' + (st.total_cards || 0) + '</span>', 'cards learned') +
                tile(st.mastered || 0, 'mastered (7+ days)') + tile(st.due || 0, 'due today') +
                tile(st.reviews || 0, 'reviews') + tile(st.sessions || 0, 'sessions') + tile(me.streak || 0, 'day streak') +
              '</div></div>' +
              '<section class="card pad"><h2>Progress</h2>' + (prog.length ? '<div class="prog">' + prog.map(function (p) {
                var pct = p.total ? Math.round(100 * p.learned / p.total) : 0;
                return '<div style="--c:' + esc(p.color || '') + '"><div class="row small"><strong>' + esc(p.title) + '</strong><span class="spacer"></span><span class="muted">' + p.learned + '/' + p.total + ' learned' +
                  (p.due ? ' · ' + p.due + ' due' : '') + '</span></div><div class="bar" style="margin-top:6px"><span style="width:' + pct + '%"></span></div></div>';
              }).join('') + '</div>' : '<p class="muted">No collections yet.</p>') + '</section>' +
            '</div><div>' +
              '<form class="card pad stack" data-el="form"><h2>Edit profile</h2>' +
                '<div><label class="f" for="qbDN">Display name</label><input type="text" id="qbDN" name="display_name" maxlength="60" required value="' + esc(me.display_name) + '"></div>' +
                '<div><label class="f" for="qbBio">About you <span class="muted">(optional)</span></label><textarea id="qbBio" name="bio" maxlength="400" placeholder="What are you learning, and why?">' + esc(me.bio || '') + '</textarea></div>' +
                '<div><label class="f">Avatar colour</label><div class="swatches">' + colors.map(function (c) {
                  return '<button type="button" data-action="color" data-c="' + esc(c) + '" style="--c:' + esc(c) + '" class="' + (c === S.color ? 'on' : '') + '" aria-label="Colour ' + esc(c) + '"></button>';
                }).join('') + '</div></div>' +
                '<div><label class="f">Theme <span class="muted">(this device)</span></label><div class="seg">' + ['auto', 'light', 'dark'].map(function (t) {
                  return '<button type="button" data-action="theme" data-t="' + t + '" class="' + (t === theme ? 'on' : '') + '">' + t[0].toUpperCase() + t.slice(1) + '</button>';
                }).join('') + '</div></div>' +
                '<div class="row"><span class="spacer"></span><button class="btn primary" type="submit"' + (S.saving ? ' disabled' : '') + '>' + (S.saving ? '<span class="spin"></span> Saving' : 'Save changes') + '</button></div>' +
              '</form>' +
              (me.is_admin ? '<section class="card pad stack"><h2>Import quizzes</h2>' +
                '<p class="muted small">Paste a quiz JSON file, or a list of them. Each card needs a <code>question</code> and an <code>answer</code>. Quizbook <code>quizzes/*.json</code> files work as is (the right option becomes the answer).</p>' +
                '<textarea class="code" data-el="json" placeholder=\'{"book": "My collection", "chapterTitle": "Quiz title", "questions": [{"question": "...", "answer": "...", "explanation": "...", "concept": "..."}]}\'></textarea>' +
                '<div class="row"><button class="btn" data-action="seed">Load demo quizzes</button><span class="spacer"></span><button class="btn primary" data-action="import">Import</button></div>' +
                '<div data-el="adminMsg"></div></section>' : '') +
            '</div></div>' +

            '<section class="card pad"><h2>Recent sessions</h2>' + (hist.length ? '<table><thead><tr><th>Studied</th><th class="hide-sm">Date</th><th style="text-align:right">Cards</th></tr></thead><tbody>' +
              hist.map(function (h) {
                return '<tr class="click" data-action="' + (h.quiz_id ? 'quiz' : 'review') + '" data-id="' + esc(h.quiz_id || '') + '"><td><strong>' + esc(h.title) + '</strong><div class="muted small">' + esc(h.collection_title) + '</div></td>' +
                  '<td class="hide-sm muted">' + esc(QB.fmtDate(h.finished)) + '</td>' +
                  '<td style="text-align:right"><span class="badge">' + h.reviewed + ' reviewed</span> ' + (h.again ? '<span class="badge warn">' + h.again + ' still learning</span>' : '<span class="badge good">all got it</span>') + '</td></tr>';
              }).join('') + '</tbody></table>' : '<p class="muted">You haven\'t studied any cards yet.</p>') + '</section>' +
            '</div>';
          root.querySelector('[data-el=form]').onsubmit = save;
        }

        function tile(v, k) { return '<div><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

        function save(e) {
          e.preventDefault();
          var f = e.target;
          var payload = { display_name: f.display_name.value.trim(), bio: f.bio.value.trim(), avatar_color: S.color };
          S.saving = true;
          var btn = f.querySelector('button[type=submit]');
          btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
          emit('save', payload).then(function (res) {
            S.saving = false;
            if (res && res.ok) { me = Object.assign(me, res.me || payload); render(); QB.toast('Profile saved'); }
            else { btn.disabled = false; btn.textContent = 'Save changes'; QB.toast((res && res.error) || 'Could not save', true); }
          }, function (err) { S.saving = false; btn.disabled = false; btn.textContent = 'Save changes'; QB.toast(String(err && err.message || err), true); });
        }

        function admin(event, payload) {
          var box = root.querySelector('[data-el=adminMsg]');
          box.innerHTML = '<p class="muted small"><span class="spin"></span> Working…</p>';
          emit(event, payload).then(function (res) {
            res = res || {};
            box.innerHTML = '<div class="feedback ' + (res.ok ? 'good' : 'bad') + '">' + esc(res.ok ? res.message : res.error) + '</div>';
          }, function (err) { box.innerHTML = '<div class="feedback bad">' + esc(String(err && err.message || err)) + '</div>'; });
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'color') {
            S.color = el.dataset.c;
            root.querySelectorAll('.swatches button').forEach(function (b) { b.classList.toggle('on', b === el); });
            var av = root.querySelector('.top .avatar'); if (av) av.style.setProperty('--c', S.color);
          } else if (a === 'theme') {
            theme = el.dataset.t;
            try { theme === 'auto' ? localStorage.removeItem('qb.theme') : localStorage.setItem('qb.theme', theme); } catch (err) {}
            QB.applyTheme(theme);
            root.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b === el); });
          } else if (a === 'quiz') emit('open_quiz', { id: el.dataset.id });
          else if (a === 'review') emit('open_review', {});
          else if (a === 'signout') emit('signout', {});
          else if (a === 'import') admin('import_json', { text: root.querySelector('[data-el=json]').value });
          else if (a === 'seed') admin('seed_demo', {});
        });

        render();
        return {};
      });
    })();
    </script>
package_name: Scratch_1
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true, use_google: false}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: Main, type: form}
