    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('quiz', function (root, data, emit) {
        var esc = QB.esc;
        var REQUEUE_GAP = 3;   // a "still learning" card returns after this many other cards
        var MAX_REPEATS = 2;   // ...at most this many extra times per session
        var S;

        function reset(d) {
          data = d;
          S = { screen: 'intro', shuffle: S ? S.shuffle : false, queue: [], ratings: [], seen: {}, repeats: {},
                revealed: false, card: null, total: 0, save: Promise.resolve(), saveFailed: false };
        }
        reset(data);

        root.innerHTML = '<div class="wrap qb-study"><div class="narrow" data-el="view"></div></div>';
        var view = root.querySelector('[data-el=view]');
        var quiz = function () { return data.quiz || {}; };

        function crumbs() {
          return '<div class="crumbs"><button data-action="back">← ' + esc(quiz().collection_title || 'Back') + '</button></div>';
        }
        function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
        function dueText(iso, count) {
          if (!iso) return '';
          var days = Math.round((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 864e5);
          var when = days <= 0 ? 'today' : days === 1 ? 'tomorrow' : days < 7 ? 'in ' + days + ' days' : 'on ' + QB.fmtDate(iso + 'T12:00:00');
          return count ? plural(count, 'card') + ' due ' + when : 'Next card due ' + when;
        }

        // ---------------------------------------------------------------- intro
        function renderIntro() {
          S.screen = 'intro';
          var q = quiz(), c = data.counts || {}, cards = data.cards || [], mixed = !q.id && !q.module_id;
          var host = '';
          try { host = q.source ? new URL(q.source).hostname.replace(/^www\./, '') : ''; } catch (e) {}
          var nNew = cards.filter(function (x) { return x.is_new; }).length, nRev = cards.length - nNew;
          var html = crumbs() + '<div class="card pad stack fade-in">' +
            '<div><div class="kind">' + esc(mixed ? 'Spaced repetition' : q.number ? 'Module ' + q.number + (q.module_id ? ' · whole module' : ' · ' + q.collection_title) : q.collection_title) + '</div><h1>' + esc(q.title) + '</h1>' +
            (q.description ? '<p class="muted">' + esc(q.description) + '</p>' : '') +
            (q.source ? '<p class="muted small">Source: <a href="' + esc(q.source) + '" target="_blank" rel="noopener">' + esc(host || q.source) + '</a>, summarized into study cards. Check the original for full context.</p>' : '') +
            (!mixed ? '<div class="counts">' +
              '<span class="badge">' + plural(c.total || 0, 'card') + '</span>' +
              '<span class="badge good">' + (c.learned || 0) + ' learned</span>' +
              (c.due ? '<span class="badge warn">' + c.due + ' due</span>' : '') +
              (c.new ? '<span class="badge accent">' + c.new + ' new</span>' : '') + '</div>' : '') + '</div>';
          if (cards.length) {
            html += '<div class="how">' +
                '<div><b>1. Recall</b>Read the question and answer it in your head.</div>' +
                '<div><b>2. Reveal</b>Click the card (or press Space) to see the answer.</div>' +
                '<div><b>3. Be honest</b>"Got it" pushes the card further out. "Still learning" keeps it coming back.</div>' +
              '</div>' +
              '<label class="toggle"><input type="checkbox" data-el="shuffle"' + (S.shuffle ? ' checked' : '') + '><span><strong>Shuffle cards</strong><br><span class="muted small">Mix up the order instead of following the quiz.</span></span></label>' +
              '<div class="row"><button class="btn primary" data-action="start">Start · ' + plural(cards.length, 'card') + '</button>' +
              '<span class="muted small">' + [nRev ? nRev + ' to review' : '', nNew ? nNew + ' new' : ''].filter(Boolean).join(' · ') +
              (c.limit && cards.length >= c.limit ? ' (session limit)' : '') + '</span></div>';
          } else {
            html += '<div class="row" style="gap:14px"><div class="done-ico">✓</div><div><h3 style="margin:0">All caught up</h3>' +
              '<div class="muted">' + esc(c.next_due ? dueText(c.next_due) + '.' : 'Nothing is due.') + '</div></div></div>' +
              '<div class="row">' + (!mixed && c.total ? '<button class="btn primary" data-action="all">Study all ' + plural(c.total, 'card') + ' anyway</button>' : '') +
              '<button class="btn ghost" data-action="back">Back</button></div>';
          }
          view.innerHTML = html + '</div>';
        }

        // ---------------------------------------------------------------- session
        function start(cards) {
          var shuffleBox = view.querySelector('[data-el=shuffle]');
          if (shuffleBox) S.shuffle = shuffleBox.checked;
          S.byId = S.byId || {};
          S.queue = (S.shuffle ? QB.shuffle(cards) : cards.slice()).map(function (c) {
            return (S.byId[c.id] = S.byId[c.id] || Object.assign({}, c)); // one live copy per card, so levels carry over
          });
          S.total = S.queue.length; S.ratings = []; S.seen = {}; S.repeats = {};
          next();
        }

        function next() {
          S.card = S.queue.shift();
          S.revealed = false;
          if (!S.card) return finish();
          S.screen = 'card';
          renderCard();
        }

        function remaining() {
          var ids = {}; if (S.card) ids[S.card.id] = 1;
          S.queue.forEach(function (c) { ids[c.id] = 1; });
          return Object.keys(ids).length;
        }

        function renderCard() {
          var c = S.card, left = remaining(), done = S.total - left;
          var dots = ''; for (var i = 1; i <= 5; i++) dots += '<i class="' + (c.box >= i ? 'on' : '') + '"></i>';
          view.innerHTML = '<div class="qhead"><button class="btn sm ghost" data-action="stop">✕ ' + (S.ratings.length ? 'Finish' : 'Stop') + '</button>' +
              '<span class="title">' + esc(quiz().title) + '</span><span class="spacer"></span><span>' + left + ' left</span></div>' +
            '<div class="bar" style="margin-bottom:14px"><span style="width:' + (100 * done / Math.max(1, S.total)) + '%"></span></div>' +
            '<div class="card flash fade-in">' +
              '<div class="front' + (S.revealed ? '' : ' clickable') + '" data-action="' + (S.revealed ? '' : 'reveal') + '">' +
                '<div class="meta">' + (c.concept ? '<span class="badge accent">' + esc(c.concept) + '</span>' : '') +
                  (c.quiz_title ? '<span class="badge">' + esc(c.quiz_title) + '</span>' : '') +
                  (c.is_new && !S.seen[c.id] ? '<span class="badge warn">new</span>' : '') +
                  (S.repeats[c.id] ? '<span class="badge">again</span>' : '') +
                  '<span class="level" title="How well you know this card">' + dots + '</span></div>' +
                '<div class="qtext">' + esc(c.text) + '</div>' +
                (!S.revealed ? '<div class="reveal"><button class="btn primary" data-action="reveal">Show answer</button></div>' : '') +
              '</div>' +
              (S.revealed ? '<div class="back"><div class="lbl">Answer</div><div class="answer">' + esc(c.answer) + '</div>' +
                (c.explanation ? '<div class="expl">' + esc(c.explanation) + '</div>' : '') +
                '<div class="rate"><button class="btn again" data-action="rate" data-knew="0">↺ Still learning<small>keep it in rotation</small></button>' +
                '<button class="btn got" data-action="rate" data-knew="1">✓ Got it<small>' + esc(gapText(c)) + '</small></button></div></div>' : '') +
            '</div>' +
            '<div class="keys">' + (S.revealed ? '<kbd>1</kbd> still learning · <kbd>2</kbd> got it' : '<kbd>Space</kbd> show answer') + '</div>';
        }

        var GAPS = [0, 1, 3, 7, 16, 35, 90]; // keep in sync with BOX_INTERVALS in QuizService
        function gapText(c) {
          var d = GAPS[Math.min((c.box || 0) + 1, GAPS.length - 1)];
          return 'see it again in ' + (d === 1 ? '1 day' : d + ' days');
        }

        function reveal() { if (S.screen === 'card' && !S.revealed) { S.revealed = true; renderCard(); } }

        function rate(knew) {
          if (S.screen !== 'card' || !S.revealed) return;
          var c = S.card;
          S.ratings.push({ question_id: c.id, knew: knew, first: !S.seen[c.id] });
          S.seen[c.id] = true;
          // Save each rating as it happens, one after another.
          S.save = S.save.then(function () { return emit('rate', { question_id: c.id, knew: knew }); })
            .then(function (res) { if (res && res.box != null) c.box = res.box; }, function (err) {
              if (!S.saveFailed) QB.toast('Could not save a rating: ' + (err && err.message || err), true);
              S.saveFailed = true;
            });
          if (knew) c.box = Math.min((c.box || 0) + 1, 6);
          else {
            c.box = 0;
            if ((S.repeats[c.id] || 0) < MAX_REPEATS) {
              S.repeats[c.id] = (S.repeats[c.id] || 0) + 1;
              S.queue.splice(Math.min(REQUEUE_GAP, S.queue.length), 0, c);
            }
          }
          next();
        }

        // ---------------------------------------------------------------- summary
        function finish() {
          S.screen = 'done';
          if (!S.ratings.length) { renderIntro(); return; }
          var last = {}, first = {}, order = [];
          S.ratings.forEach(function (r) {
            if (!(r.question_id in first)) { first[r.question_id] = r.knew; order.push(r.question_id); }
            last[r.question_id] = r.knew;
          });
          var byId = S.byId;
          var n = order.length;
          var firstTry = order.filter(function (id) { return first[id]; }).length;
          var still = order.filter(function (id) { return !last[id]; });
          var recovered = n - firstTry - still.length;
          S.still = still.map(function (id) { return byId[id]; });

          view.innerHTML = crumbs() + '<div class="card pad stack fade-in">' +
            '<div class="muted small">' + esc(quiz().title) + ' · session complete</div>' +
            '<div class="row" style="gap:18px;align-items:flex-end"><div class="big">' + n + '</div><div style="padding-bottom:4px">' + (n === 1 ? 'card' : 'cards') + ' reviewed</div>' +
              '<span class="spacer"></span><div data-el="gains" class="row" style="gap:6px"><span class="badge"><span class="spin"></span> saving…</span></div></div>' +
            '<div><div class="split"><span class="g" style="width:' + (100 * (n - still.length) / n) + '%"></span><span class="a" style="width:' + (100 * still.length / n) + '%"></span></div>' +
              '<div class="row small"><span><span class="badge good">' + firstTry + ' got it first time</span></span>' +
              (recovered ? '<span class="badge accent">' + recovered + ' after another look</span>' : '') +
              (still.length ? '<span class="badge warn">' + still.length + ' still learning</span>' : '') + '</div></div>' +
            '<p data-el="next" class="muted"></p>' +
            '<div class="row">' + (S.still.length ? '<button class="btn primary" data-action="again">Go again with the ' + plural(S.still.length, 'card') + ' I\'m still learning</button>' : '') +
              '<button class="btn' + (S.still.length ? '' : ' primary') + '" data-action="back">Done</button></div>' +
            (S.still.length ? '<h3 style="margin-top:18px">Still in rotation</h3><div class="list">' + S.still.map(function (c) {
              return '<details><summary>' + esc(c.text) + '</summary><div style="margin-top:8px"><strong>' + esc(c.answer) + '</strong>' +
                (c.explanation ? '<div class="muted small" style="margin-top:4px">' + esc(c.explanation) + '</div>' : '') + '</div></details>';
            }).join('') + '</div>' : '') +
            '</div>';

          var ratings = S.ratings.map(function (r) { return { question_id: r.question_id, knew: r.knew, first: r.first }; });
          S.save.then(function () { return emit('finish', { quiz_id: quiz().id || null, ratings: ratings }); }).then(function (res) {
            res = res || {};
            var g = view.querySelector('[data-el=gains]');
            if (g) g.innerHTML = (res.xp_gained ? '<span class="badge accent">+' + res.xp_gained + ' XP</span>' : '') +
              (res.streak ? '<span class="badge warn">🔥 ' + res.streak + '-day streak</span>' : '') || '<span class="badge good">Saved</span>';
            var nx = view.querySelector('[data-el=next]');
            if (nx) nx.textContent = still.length ? 'Cards you are still learning stay due, so they will be in your next review.'
              : res.next_due ? dueText(res.next_due) + '. Come back then to keep the streak going.' : '';
          }, function (err) {
            var g = view.querySelector('[data-el=gains]');
            if (g) g.innerHTML = '<span class="badge bad">Session not saved</span>';
            QB.toast('Could not save the session: ' + (err && err.message || err), true);
          });
        }

        // ---------------------------------------------------------------- events
        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el || !root.contains(el) || !el.dataset.action) return;
          var a = el.dataset.action;
          if (a === 'start') start(data.cards || []);
          else if (a === 'reveal') reveal();
          else if (a === 'rate') rate(el.dataset.knew === '1');
          else if (a === 'stop') { if (S.ratings.length) { S.queue = []; finish(); } else renderIntro(); }
          else if (a === 'again') start(S.still);
          else if (a === 'back') emit('back', {});
          else if (a === 'all') {
            el.disabled = true; el.innerHTML = '<span class="spin"></span>';
            emit('load', { scope: 'all' }).then(function (d) { reset(d); renderIntro(); start(data.cards || []); },
              function (err) { QB.toast(String(err && err.message || err), true); renderIntro(); });
          }
        });

        function onKey(e) {
          if (!document.body.contains(root)) { document.removeEventListener('keydown', onKey); return; }
          if (S.screen !== 'card' || e.ctrlKey || e.metaKey || e.altKey) return;
          if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
          if (!S.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
          else if (S.revealed && e.key === '1') { e.preventDefault(); rate(false); }
          else if (S.revealed && e.key === '2') { e.preventDefault(); rate(true); }
          else if (S.revealed && (e.key === ' ' || e.key === 'Enter')) e.preventDefault(); // no accidental clicks
        }
        document.addEventListener('keydown', onKey);

        renderIntro();
        return { destroy: function () { document.removeEventListener('keydown', onKey); } };
      });
    })();
    </script>

    <!-- ===== ProfilePage component ===== -->
    <style>
    .qb-prof .top { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    .qb-prof .top h1 { margin: 0; }
    .qb-prof .cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
    .qb-prof .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .qb-prof .stats > div { padding: 12px 14px; border: 1px solid var(--qb-line); border-radius: 12px; background: var(--qb-panel-2); }
    .qb-prof .stats .v { font-family: var(--qb-serif); font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
    .qb-prof .stats .k { font-size: .8rem; color: var(--qb-muted); }
    .qb-prof .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .qb-prof .swatches button { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
    .qb-prof .swatches button.on { outline: 3px solid var(--qb-ink); outline-offset: 2px; }
    .qb-prof .prog > div + div { margin-top: 12px; }
    .qb-prof .prog .bar > span { background: var(--c, var(--qb-accent)); }
    .qb-prof table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    .qb-prof th { text-align: left; font-weight: 600; color: var(--qb-muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; padding: 0 10px 8px; }
    .qb-prof td { padding: 10px; border-top: 1px solid var(--qb-line); vertical-align: middle; }
    .qb-prof tr.click, .qb-prof .prog .click { cursor: pointer; }
    .qb-prof .prog .click:hover strong { color: var(--qb-accent); }
    .qb-prof input[type=file] { font: inherit; font-size: .88rem; max-width: 100%; }
    .qb-prof tr.click:hover td { background: var(--qb-panel-2); }
    .qb-prof .seg { display: inline-flex; padding: 3px; gap: 3px; border: 1px solid var(--qb-line); border-radius: 10px; background: var(--qb-panel-2); }
    .qb-prof .seg button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 8px; font-size: .88rem; color: var(--qb-muted); }
    .qb-prof .seg button.on { background: var(--qb-panel); color: var(--qb-ink); box-shadow: var(--qb-shadow); }
    .qb-prof textarea.code { font: 12.5px/1.5 ui-monospace, Consolas, monospace; min-height: 140px; }
    .qb-prof section { margin-top: 16px; }
    @media (max-width: 760px) { .qb-prof .cols { grid-template-columns: 1fr; } .qb-prof .hide-sm { display: none; } }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      QB.define('profile', function (root, data, emit) {
        var esc = QB.esc;
        var me = data.me || {}, st = data.stats || {}, prog = data.progress || [], hist = data.history || [];
        var colors = data.colors || ['#2e4a70', '#c8102e', '#556b2f', '#3b6ea5', '#8a7a4f', '#5c6470', '#2f7a78', '#7a2e3b'];
        var S = { color: me.avatar_color || colors[0], saving: false };
        var theme = 'auto';
        try { theme = localStorage.getItem('qb.theme') || 'auto'; } catch (e) {}

        function render() {
          root.innerHTML = '<div class="wrap qb-prof fade-in">' +
            '<div class="top">' + QB.avatar(Object.assign({}, me, { avatar_color: S.color }), 'lg') +
              '<div><h1>' + esc(me.display_name) + '</h1><div class="muted small">' + (me.guest ? 'Guest · progress is kept only until you close this tab' : esc(me.email)) +
              (me.signed_up ? ' · member since ' + esc(QB.fmtDate(me.signed_up)) : '') + (me.is_admin ? ' · <span class="badge accent">admin</span>' : '') + '</div>' +
              (me.bio ? '<p style="margin:6px 0 0;max-width:60ch">' + esc(me.bio) + '</p>' : '') + '</div>' +
              '<span class="spacer"></span><button class="btn" data-action="signout">' + (me.guest ? 'Exit guest mode' : 'Sign out') + '</button></div>' +

            '<div class="cols"><div>' +
              '<div class="card pad stack"><h2>Your stats</h2><div class="stats">' +
                tile((st.learned || 0) + '<span class="muted" style="font-size:.9rem"> / ' + (st.total_cards || 0) + '</span>', 'cards learned') +
                tile(st.mastered || 0, 'mastered (7+ days)') + tile(st.due || 0, 'due today') +
                tile(st.reviews || 0, 'reviews') + tile(st.sessions || 0, 'sessions') + tile(me.streak || 0, 'day streak') +
              '</div></div>' +
              '<section class="card pad"><h2>Modules</h2>' + (prog.length ? '<p class="muted small">' + prog.filter(function (p) { return p.complete; }).length + ' of ' + prog.length + ' modules complete</p><div class="prog">' + prog.map(function (p) {
                var pct = p.total ? Math.round(100 * p.learned / p.total) : 0;
                return '<div class="click" data-action="col" data-id="' + esc(p.id || '') + '" style="--c:' + esc(p.color || '') + '"><div class="row small"><strong>' + (p.complete ? '✓ ' : '') + (p.number ? String(p.number).padStart(2, '0') + ' · ' : '') + esc(p.title) + '</strong><span class="spacer"></span><span class="muted">' + p.learned + '/' + p.total +
                  (p.due ? ' · ' + p.due + ' due' : '') + '</span></div><div class="bar" style="margin-top:6px"><span style="width:' + pct + '%"></span></div></div>';
              }).join('') + '</div>' : '<p class="muted">No modules yet.</p>') + '</section>' +
            '</div><div>' +
              '<form class="card pad stack" data-el="form"><h2>Edit profile</h2>' +
                '<div><label class="f" for="qbDN">Display name</label><input type="text" id="qbDN" name="display_name" maxlength="60" required value="' + esc(me.display_name) + '"></div>' +
                '<div><label class="f" for="qbBio">About you <span class="muted">(optional)</span></label><textarea id="qbBio" name="bio" maxlength="400" placeholder="What are you learning, and why?">' + esc(me.bio || '') + '</textarea></div>' +
                '<div><label class="f">Avatar colour</label><div class="swatches">' + colors.map(function (c) {
                  return '<button type="button" data-action="color" data-c="' + esc(c) + '" style="--c:' + esc(c) + '" class="' + (c === S.color ? 'on' : '') + '" aria-label="Colour ' + esc(c) + '"></button>';
                }).join('') + '</div></div>' +
                '<div><label class="f">Theme <span class="muted">(this device)</span></label><div class="seg">' + ['auto', 'light', 'dark'].map(function (t) {
                  return '<button type="button" data-action="theme" data-t="' + t + '" class="' + (t === theme ? 'on' : '') + '">' + t[0].toUpperCase() + t.slice(1) + '</button>';
                }).join('') + '</div></div>' +
                '<div class="row"><span class="spacer"></span><button class="btn primary" type="submit"' + (S.saving ? ' disabled' : '') + '>' + (S.saving ? '<span class="spin"></span> Saving' : 'Save changes') + '</button></div>' +
              '</form>' +
              (me.guest ? '<section class="card pad stack" style="margin-top:16px"><h2>Save your progress</h2><p class="muted small">You are trying CAF Guide as a guest. Nothing is saved to an account, and your progress ends when you close this tab. Create a free account to keep your cards, streak and completed modules.</p>' +
                '<div class="row"><span class="spacer"></span><button class="btn primary" data-action="signout">Sign in or create an account</button></div></section>' :
              '<form class="card pad stack" data-el="pwForm" style="margin-top:16px"><h2>Change password</h2>' +
                '<div><label class="f" for="qbPwOld">Current password</label><input type="password" id="qbPwOld" name="old" autocomplete="current-password" required></div>' +
                '<div><label class="f" for="qbPwNew">New password</label><input type="password" id="qbPwNew" name="new" autocomplete="new-password" required></div>' +
                '<div><label class="f" for="qbPwNew2">Repeat new password</label><input type="password" id="qbPwNew2" name="new2" autocomplete="new-password" required></div>' +
                '<div class="row"><button class="btn" type="button" data-action="pw_reset">Forgot it? Email me a link</button><span class="spacer"></span><button class="btn primary" type="submit">Change password</button></div>' +
                '<div data-el="pwMsg"></div>' +
              '</form>') +
              (me.is_admin ? '<section class="card pad stack"><h2>Manage curriculum</h2>' +
                '<p class="muted small">Preview, edit or delete modules, parts and cards after they were imported, and download them as JSON.</p>' +
                '<div class="row"><span class="spacer"></span><button class="btn primary" data-action="curriculum">Manage curriculum</button></div></section>' : '') +
              (me.is_admin ? '<section class="card pad stack"><h2>Import learning modules</h2>' +
                '<p class="muted small">Choose one or more module files (the <code>modules/*.json</code> files). Each part is imported on its own, so large modules are fine. Importing a module again updates it and keeps everyone\'s progress on unchanged cards.</p>' +
                '<div class="row"><input type="file" data-el="files" accept=".json,application/json" multiple><span class="spacer"></span><button class="btn primary" data-action="import_files">Import selected files</button></div>' +
                '<details><summary class="small">Or paste JSON</summary><div class="stack" style="margin-top:10px">' +
                  '<textarea class="code" data-el="json" placeholder=\'{"collection": "My module", "title": "Part 1", "questions": [{"question": "...", "answer": "...", "explanation": "...", "concept": "..."}]}\'></textarea>' +
                  '<div class="row"><button class="btn" data-action="seed">Load 27 sample cards</button><span class="spacer"></span><button class="btn" data-action="import">Import pasted JSON</button></div>' +
                '</div></details>' +
                '<div data-el="adminMsg"></div></section>' : '') +
            '</div></div>' +

            '<section class="card pad"><h2>Recent sessions</h2>' + (hist.length ? '<table><thead><tr><th>Studied</th><th class="hide-sm">Date</th><th style="text-align:right">Cards</th></tr></thead><tbody>' +
              hist.map(function (h) {
                return '<tr class="click" data-action="' + (h.quiz_id ? 'quiz' : h.collection_id ? 'col' : 'review') + '" data-id="' + esc(h.quiz_id || h.collection_id || '') + '"><td><strong>' + esc(h.title) + '</strong><div class="muted small">' + esc(h.collection_title) + '</div></td>' +
                  '<td class="hide-sm muted">' + esc(QB.fmtDate(h.finished)) + '</td>' +
                  '<td style="text-align:right"><span class="badge">' + h.reviewed + ' reviewed</span> ' + (h.again ? '<span class="badge warn">' + h.again + ' still learning</span>' : '<span class="badge good">all got it</span>') + '</td></tr>';
              }).join('') + '</tbody></table>' : '<p class="muted">You haven\'t studied any cards yet.</p>') + '</section>' +
            '</div>';
          root.querySelector('[data-el=form]').onsubmit = save;
          var pw = root.querySelector('[data-el=pwForm]');
          if (pw) pw.onsubmit = changePassword;
        }

        function tile(v, k) { return '<div><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }

        function save(e) {
          e.preventDefault();
          var f = e.target;
          var payload = { display_name: f.display_name.value.trim(), bio: f.bio.value.trim(), avatar_color: S.color };
          S.saving = true;
          var btn = f.querySelector('button[type=submit]');
          btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
          emit('save', payload).then(function (res) {
            S.saving = false;
            if (res && res.ok) { me = Object.assign(me, res.me || payload); render(); QB.toast('Profile saved'); }
            else { btn.disabled = false; btn.textContent = 'Save changes'; QB.toast((res && res.error) || 'Could not save', true); }
          }, function (err) { S.saving = false; btn.disabled = false; btn.textContent = 'Save changes'; QB.toast(String(err && err.message || err), true); });
        }

        function pwMsg(ok, text) {
          root.querySelector('[data-el=pwMsg]').innerHTML = text ? '<div class="feedback ' + (ok ? 'good' : 'bad') + '">' + esc(text) + '</div>' : '';
        }

        function changePassword(e) {
          e.preventDefault();
          var f = e.target;
          if (f.new.value !== f.new2.value) { pwMsg(false, "The new passwords don't match."); return; }
          if (f.new.value === f.old.value) { pwMsg(false, 'The new password is the same as the current one.'); return; }
          var btn = f.querySelector('button[type=submit]');
          btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Changing';
          pwMsg(true, '');
          function done() { btn.disabled = false; btn.textContent = 'Change password'; }
          emit('change_password', { old: f.old.value, new: f.new.value }).then(function (res) {
            done();
            if (res && res.ok) { f.reset(); pwMsg(true, 'Password changed. Use the new one next time you sign in.'); QB.toast('Password changed'); }
            else pwMsg(false, (res && res.error) || 'Could not change the password.');
          }, function (err) { done(); pwMsg(false, String(err && err.message || err)); });
        }

        function resetEmail(btn) {
          btn.disabled = true;
          emit('reset_email', {}).then(function (res) {
            btn.disabled = false;
            pwMsg(!!(res && res.ok), (res && (res.message || res.error)) || 'Could not send the email.');
          }, function (err) { btn.disabled = false; pwMsg(false, String(err && err.message || err)); });
        }

        function admin(event, payload) {
          var box = root.querySelector('[data-el=adminMsg]');
          box.innerHTML = '<p class="muted small"><span class="spin"></span> Working…</p>';
          emit(event, payload).then(function (res) {
            res = res || {};
            box.innerHTML = '<div class="feedback ' + (res.ok ? 'good' : 'bad') + '">' + esc(res.ok ? res.message : res.error) + '</div>';
          }, function (err) { box.innerHTML = '<div class="feedback bad">' + esc(String(err && err.message || err)) + '</div>'; });
        }

        // Import module files one part at a time, so no single server call gets too big.
        function importFiles() {
          var input = root.querySelector('[data-el=files]');
          var box = root.querySelector('[data-el=adminMsg]');
          var files = Array.prototype.slice.call((input && input.files) || []);
          if (!files.length) { box.innerHTML = '<div class="feedback bad">Choose at least one .json file first.</div>'; return; }
          var btn = root.querySelector('[data-action=import_files]');
          btn.disabled = true;
          var done = 0, cards = 0, errors = [];
          files.sort(function (a, b) { return a.name.localeCompare(b.name); });
          var chain = Promise.resolve();
          files.forEach(function (file, fi) {
            chain = chain.then(function () { return file.text(); }).then(function (text) {
              var data;
              try { data = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (err) { errors.push(file.name + ': not valid JSON'); return; }
              var items = Array.isArray(data) ? data : data.quizzes || [data];
              var inner = Promise.resolve();
              items.forEach(function (item, ii) {
                inner = inner.then(function () {
                  box.innerHTML = '<p class="muted small"><span class="spin"></span> File ' + (fi + 1) + ' of ' + files.length + ' (' + esc(file.name) + ') · part ' + (ii + 1) + ' of ' + items.length + '…</p>';
                  return emit('import_json', { text: JSON.stringify(item) });
                }).then(function (res) {
                  if (res && res.ok) { done++; cards += (item.questions || item.cards || []).length; }
                  else errors.push(file.name + ' part ' + (ii + 1) + ': ' + ((res && res.error) || 'failed'));
                }, function (err) { errors.push(file.name + ' part ' + (ii + 1) + ': ' + (err && err.message || err)); });
              });
              return inner;
            });
          });
          chain.then(function () {
            btn.disabled = false;
            box.innerHTML = '<div class="feedback ' + (errors.length ? 'bad' : 'good') + '"><strong>Imported ' + done + ' part' + (done === 1 ? '' : 's') + ' (' + cards + ' cards) from ' + files.length + ' file' + (files.length === 1 ? '' : 's') + '.</strong>' +
              (errors.length ? '<div class="small" style="margin-top:6px">' + errors.map(esc).join('<br>') + '</div>' : '<div class="small">Open your learning path to see the modules.</div>') + '</div>';
          });
        }

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el) return;
          var a = el.dataset.action;
          if (a === 'color') {
            S.color = el.dataset.c;
            root.querySelectorAll('.swatches button').forEach(function (b) { b.classList.toggle('on', b === el); });
            var av = root.querySelector('.top .avatar'); if (av) av.style.setProperty('--c', S.color);
          } else if (a === 'theme') {
            theme = el.dataset.t;
            try { theme === 'auto' ? localStorage.removeItem('qb.theme') : localStorage.setItem('qb.theme', theme); } catch (err) {}
            QB.applyTheme(theme);
            root.querySelectorAll('.seg button').forEach(function (b) { b.classList.toggle('on', b === el); });
          } else if (a === 'quiz') emit('open_quiz', { id: el.dataset.id });
          else if (a === 'review') emit('open_review', {});
          else if (a === 'signout') emit('signout', {});
          else if (a === 'import') admin('import_json', { text: root.querySelector('[data-el=json]').value });
          else if (a === 'import_files') importFiles();
          else if (a === 'col') emit('open_collection', { id: el.dataset.id });
          else if (a === 'seed') admin('seed_demo', {});
          else if (a === 'curriculum') emit('open_curriculum', {});
          else if (a === 'pw_reset') resetEmail(el);
        });

        render();
        return {};
      });
    })();
    </script>

    <!-- ===== CurriculumPage component ===== -->
    <style>
    .qb-cur .head { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
    .qb-cur .head h1 { margin: 0 0 4px; }
    .qb-cur .tools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .qb-cur .tools input { max-width: 360px; }
    .qb-cur .list { display: grid; gap: 10px; }
    .qb-cur .mod { padding: 0; overflow: hidden; border-left: 4px solid var(--c, var(--qb-accent)); }
    .qb-cur .mhead, .qb-cur .phead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 16px; }
    .qb-cur .tog { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; flex: 1; min-width: 200px; }
