package_name: CAF_Guide
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config:
    auto_create_missing_columns: false
  source: /runtime/services/tables.yml
- client_config:
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    use_email: true
    use_google: false
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
