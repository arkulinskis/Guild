    \ +\n        '<div class=\"grid2\">' + field('Number', 'number', m.number, { type: 'number', required: true, hint: 'Its\
    \ place in the learning path.' }) +\n          '<div><label class=\"f\">Colour</label><div class=\"row\"><input type=\"\
    color\" name=\"color\" value=\"' + esc(m.color) + '\" aria-label=\"Module colour\">' +\n          '<span class=\"muted\
    \ small\">Used for its number and progress bars.</span></div></div></div>' +\n        field('Title', 'title', m.title,\
    \ { required: true, hint: 'Importing a file matches modules by title, so renaming means a later import of the old file\
    \ creates a new module.' }) +\n        field('Description', 'description', m.description, { area: true }) +\n        shown(m)\
    \ + formEnd('Save module') + '</form>';\n    }\n\n    function partForm(p) {\n      return '<form class=\"edit\" data-form=\"\
    part\" data-id=\"' + esc(p.id) + '\"><h3 style=\"margin:0\">Edit part</h3>' +\n        '<div class=\"grid2\">' + field('Number',\
    \ 'number', p.number, { type: 'number', required: true, hint: 'Its order within the module.' }) +\n          field('Source\
    \ link', 'source', p.source === 'import' ? '' : p.source, { hint: 'Shown to learners as the source.' }) + '</div>' +\n\
    \        field('Title', 'title', p.title, { required: true }) +\n        field('Description', 'description', p.description,\
    \ { area: true }) +\n        shown(p) + formEnd('Save part') + '</form>';\n    }\n\n    function cardForm(c, partId) {\n\
    \      return '<form class=\"edit\" data-form=\"card\" data-id=\"' + esc(c.id || '') + '\" data-part=\"' + esc(partId)\
    \ + '\"><h3 style=\"margin:0\">' + (c.id ? 'Edit card' : 'New card') + '</h3>' +\n        field('Question', 'question',\
    \ c.question, { area: true, required: true }) +\n        field('Answer', 'answer', c.answer, { area: true, required: true,\
    \ hint: 'Keep it short: the learner checks their own recall against it.' }) +\n        field('Explanation <span class=\"\
    muted\">(optional)</span>', 'explanation', c.explanation, { area: true }) +\n        field('Concept <span class=\"muted\"\
    >(optional)</span>', 'concept', c.concept) +\n        formEnd(c.id ? 'Save card' : 'Add card') + '</form>';\n    }\n\n\
    \    // ---- flashcard preview (nothing is recorded)\n    function pvHtml() {\n      var cs = S.cards[S.pv.part] || [],\
    \ c = cs[S.pv.i] || {}, info = findPart(S.pv.part) || { part: {} };\n      return '<div class=\"pv\" data-action=\"pv_close\"\
    \ role=\"dialog\" aria-modal=\"true\" aria-label=\"Card preview\"><div class=\"box\" data-el=\"pvbox\">' +\n        '<div\
    \ class=\"row small\"><span class=\"muted\">' + esc(info.part.title) + '</span><span class=\"spacer\"></span><span class=\"\
    badge\">' + (S.pv.i + 1) + ' / ' + cs.length + '</span></div>' +\n        '<div class=\"face\">' + (c.concept ? '<div\
    \ class=\"kind\">' + esc(c.concept) + '</div>' : '') +\n          '<div class=\"qq\">' + esc(c.question) + '</div>' +\n\
    \          (S.pv.flip ? '<div class=\"aa\">' + esc(c.answer) + '</div>' + (c.explanation ? '<div class=\"ee\">' + esc(c.explanation)\
    \ + '</div>' : '') : '') + '</div>' +\n        '<div class=\"row\"><button class=\"btn\" data-action=\"pv_prev\"' + (S.pv.i\
    \ ? '' : ' disabled') + '>← Previous</button><span class=\"spacer\"></span>' +\n          (S.pv.flip ? '' : '<button class=\"\
    btn primary\" data-action=\"pv_flip\">Show answer</button>') +\n          '<button class=\"btn\" data-action=\"pv_next\"\
    ' + (S.pv.i < cs.length - 1 ? '' : ' disabled') + '>Next →</button>' +\n          '<button class=\"btn ghost\" data-action=\"\
    pv_close\">Close</button></div>' +\n        '<p class=\"muted small\" style=\"margin:10px 0 0\">Preview only: nothing\
    \ is recorded. Keys: space shows the answer, ← → move, Esc closes.</p>' +\n      '</div></div>';\n    }\n    function\
    \ renderPv() {\n      var old = root.querySelector('.pv');\n      if (old) old.remove();\n      if (S.pv) root.querySelector('.qb-cur').insertAdjacentHTML('beforeend',\
    \ pvHtml());\n    }\n    function pvMove(d) {\n      var n = (S.cards[S.pv.part] || []).length;\n      var i = Math.max(0,\
    \ Math.min(n - 1, S.pv.i + d));\n      if (i !== S.pv.i) { S.pv.i = i; S.pv.flip = false; renderPv(); }\n    }\n    function\
    \ onKey(e) {\n      if (!document.body.contains(root)) { document.removeEventListener('keydown', onKey); return; }\n \
    \     if (!S.pv) return;\n      if (e.key === 'Escape') { S.pv = null; renderPv(); }\n      else if (e.key === 'ArrowRight')\
    \ pvMove(1);\n      else if (e.key === 'ArrowLeft') pvMove(-1);\n      else if (e.key === ' ' || e.key === 'Enter') {\
    \ e.preventDefault(); if (!S.pv.flip) { S.pv.flip = true; renderPv(); } else pvMove(1); }\n    }\n    document.addEventListener('keydown',\
    \ onKey);\n\n    // ---- server calls\n    function fail(err) { QB.toast(String(err && err.message || err || 'Something\
    \ went wrong'), true); }\n\n    function loadPart(id) {\n      S.cards[id] = 'loading';\n      return emit('load_part',\
    \ { id: id }).then(function (res) {\n        S.cards[id] = res && res.ok ? res.cards : { error: (res && res.error) ||\
    \ 'Could not load the cards.' };\n      }, function (err) { S.cards[id] = { error: String(err && err.message || err) };\
    \ });\n    }\n\n    function exportJson(id, btn) {\n      btn.disabled = true;\n      var label = btn.innerHTML;\n   \
    \   btn.innerHTML = '<span class=\"spin\"></span> Preparing';\n      emit('export', { id: id || null }).then(function\
    \ (res) {\n        btn.disabled = false; btn.innerHTML = label;\n        if (!res || !res.ok) return fail(res && res.error);\n\
    \        var items = res.items || [];\n        QB.saveFile(res.filename, JSON.stringify(items, null, 1));\n        var\
    \ n = items.reduce(function (a, it) { return a + (it.questions || []).length; }, 0);\n        QB.toast('Downloaded ' +\
    \ res.filename + ' (' + plural(items.length, 'part') + ', ' + plural(n, 'card') + ')');\n      }, function (err) { btn.disabled\
    \ = false; btn.innerHTML = label; fail(err); });\n    }\n\n    function remove(kind, id, btn) {\n      var msg;\n    \
    \  if (kind === 'module') {\n        var m = findMod(id);\n        msg = 'Delete module ' + pad(m.number) + ' · ' + m.title\
    \ + '?\\n\\nThis removes its ' + plural(m.parts.length, 'part') + ' and ' + plural(m.card_count, 'card') +\n         \
    \ ', and every learner\\'s progress on them. It can\\'t be undone.\\n\\nTip: cancel and use \"Download JSON\" first to\
    \ keep a copy.';\n      } else if (kind === 'part') {\n        var p = findPart(id).part;\n        msg = 'Delete the part\
    \ \"' + p.title + '\"?\\n\\nThis removes its ' + plural(p.card_count, 'card') + ' and every learner\\'s progress on them.\
    \ It can\\'t be undone.';\n      } else {\n        msg = 'Delete this card?\\n\\nEvery learner\\'s progress on it is removed\
    \ too. It can\\'t be undone.';\n      }\n      if (!window.confirm(msg)) return;\n      btn.disabled = true;\n      emit('delete',\
    \ { kind: kind, id: id }).then(function (res) {\n        if (!res || !res.ok) { btn.disabled = false; return fail(res\
    \ && res.error); }\n        if (kind === 'module') S.mods = S.mods.filter(function (x) { return x.id !== id; });\n   \
    \     else if (kind === 'part') { var f = findPart(id); f.mod.parts = f.mod.parts.filter(function (x) { return x.id !==\
    \ id; }); f.mod.card_count -= f.part.card_count; delete S.cards[id]; }\n        else {\n          var pid = btn.dataset.part,\
    \ info = findPart(pid);\n          S.cards[pid] = S.cards[pid].filter(function (c) { return c.id !== id; });\n       \
    \   info.mod.card_count += res.card_count - info.part.card_count; info.part.card_count = res.card_count;\n        }\n\
    \        if (S.edit && S.edit.id === id) S.edit = null;\n        renderList();\n        QB.toast(res.message);\n     \
    \ }, function (err) { btn.disabled = false; fail(err); });\n    }\n\n    function submit(form) {\n      var kind = form.dataset.form,\
    \ id = form.dataset.id || null, f = form.elements;\n      var fields = {};\n      ['number', 'title', 'description', 'color',\
    \ 'source', 'question', 'answer', 'explanation', 'concept'].forEach(function (k) {\n        if (f[k]) fields[k] = f[k].value;\n\
    \      });\n      if (f.published) fields.published = f.published.checked;\n      var btn = form.querySelector('button[type=submit]'),\
    \ label = btn.textContent;\n      var errBox = form.querySelector('[data-el=err]');\n      btn.disabled = true; btn.innerHTML\
    \ = '<span class=\"spin\"></span> Saving';\n      errBox.textContent = '';\n      var event = kind === 'module' ? 'save_module'\
    \ : kind === 'part' ? 'save_part' : 'save_card';\n      var payload = kind === 'card' ? { quiz_id: form.dataset.part,\
    \ id: id, fields: fields } : { id: id, fields: fields };\n      emit(event, payload).then(function (res) {\n        if\
    \ (!res || !res.ok) { btn.disabled = false; btn.textContent = label; errBox.textContent = (res && res.error) || 'Could\
    \ not save.'; return; }\n        if (kind === 'module') {\n          var i = S.mods.indexOf(findMod(id));\n          S.mods[i]\
    \ = res.module;\n          S.mods.sort(function (a, b) { return (a.number || 0) - (b.number || 0); });\n        } else\
    \ if (kind === 'part') {\n          var f1 = findPart(id), j = f1.mod.parts.indexOf(f1.part);\n          f1.mod.parts[j]\
    \ = res.part;\n          f1.mod.parts.sort(function (a, b) { return (a.number || 0) - (b.number || 0); });\n        }\
    \ else {\n          var pid = form.dataset.part, info = findPart(pid), cs = S.cards[pid];\n          if (id) cs[cs.map(function\
    \ (c) { return c.id; }).indexOf(id)] = res.card; else cs.push(res.card);\n          info.mod.card_count += res.card_count\
    \ - info.part.card_count; info.part.card_count = res.card_count;\n        }\n        S.edit = null;\n        renderList();\n\
    \        QB.toast(kind === 'card' ? (id ? 'Card saved' : 'Card added') : (kind === 'module' ? 'Module saved' : 'Part saved'));\n\
    \      }, function (err) { btn.disabled = false; btn.textContent = label; errBox.textContent = String(err && err.message\
    \ || err); });\n    }\n\n    function startEdit(kind, id, extra) {\n      S.edit = Object.assign({ kind: kind, id: id\
    \ }, extra || {});\n      renderList();\n      var form = root.querySelector('form.edit');\n      if (form) { var first\
    \ = form.querySelector('textarea, input[type=text]'); if (first) first.focus(); form.scrollIntoView({ block: 'nearest'\
    \ }); }\n    }\n\n    root.addEventListener('submit', function (e) {\n      var form = e.target.closest('form.edit');\n\
    \      if (!form) return;\n      e.preventDefault();\n      submit(form);\n    });\n\n    root.addEventListener('click',\
    \ function (e) {\n      var el = e.target.closest('[data-action]');\n      if (!el || el.disabled) return;\n      var\
    \ a = el.dataset.action, id = el.dataset.id;\n      if (a === 'pv_close' && el.classList.contains('pv') && e.target !==\
    \ el) return; // clicks inside the card keep it open\n      if (a === 'back') emit('back', {});\n      else if (a ===\
    \ 'toggle_mod') { S.open[id] = !S.open[id]; renderList(); }\n      else if (a === 'toggle_part') {\n        S.openPart[id]\
    \ = !S.openPart[id];\n        if (S.openPart[id] && (S.cards[id] === undefined || S.cards[id].error)) loadPart(id).then(renderList);\n\
    \        renderList();\n      }\n      else if (a === 'edit_mod') startEdit('module', isEditing('module', id) ? null :\
    \ id);\n      else if (a === 'edit_part') startEdit('part', isEditing('part', id) ? null : id);\n      else if (a ===\
    \ 'edit_card') startEdit('card', id);\n      else if (a === 'add_card') startEdit('card', null, { quiz: el.dataset.part\
    \ });\n      else if (a === 'cancel') { S.edit = null; renderList(); }\n      else if (a === 'del_mod') remove('module',\
    \ id, el);\n      else if (a === 'del_part') remove('part', id, el);\n      else if (a === 'del_card') remove('card',\
    \ id, el);\n      else if (a === 'export_mod') exportJson(id, el);\n      else if (a === 'export_all') exportJson(null,\
    \ el);\n      else if (a === 'view_mod') emit('open_collection', { id: id });\n      else if (a === 'preview') {\n   \
    \     var go = function () { if (Array.isArray(S.cards[id]) && S.cards[id].length) { S.pv = { part: id, i: 0, flip: false\
    \ }; renderPv(); } else if (S.cards[id] && S.cards[id].error) fail(S.cards[id].error); };\n        if (Array.isArray(S.cards[id]))\
    \ go();\n        else { el.disabled = true; loadPart(id).then(function () { el.disabled = false; if (S.openPart[id]) renderList();\
    \ go(); }); }\n      }\n      else if (a === 'pv_flip') { S.pv.flip = true; renderPv(); }\n      else if (a === 'pv_next')\
    \ pvMove(1);\n      else if (a === 'pv_prev') pvMove(-1);\n      else if (a === 'pv_close') { S.pv = null; renderPv();\
    \ }\n    });\n\n    render();\n    return {};\n  });\n})();\n</script>\n"
package_name: CAF_Guide
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config:
    auto_create_missing_columns: false
  source: /runtime/services/tables.yml
- client_config:
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    use_email: true
    use_google: false
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: Main
  type: form
