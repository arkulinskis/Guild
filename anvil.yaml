    .qb-cur .crd .e { font-size: .88rem; color: var(--qb-muted); overflow-wrap: anywhere; margin-top: 2px; }
    .qb-cur .crd .acts { grid-column: 3; grid-row: 1 / span 3; align-self: start; }
    .qb-cur .edit { padding: 14px 16px; border: 1px dashed var(--qb-accent); border-radius: 10px; background: var(--qb-panel); }
    .qb-cur .edit > * + * { margin-top: 10px; }
    .qb-cur .edit .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .qb-cur .edit input[type=number] { font: inherit; color: var(--qb-ink); background: var(--qb-panel-2); border: 1px solid var(--qb-line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
    .qb-cur .edit input[type=color] { width: 48px; height: 40px; padding: 2px; border: 1px solid var(--qb-line); border-radius: 8px; background: var(--qb-panel-2); cursor: pointer; }
    .qb-cur .edit textarea { min-height: 64px; }
    .qb-cur .err { color: var(--qb-bad); font-size: .9rem; }
    .qb-cur .empty { padding: 28px 16px; }
    /* flashcard preview */
    .qb-cur .pv { position: fixed; inset: 0; z-index: 900; background: rgba(10, 14, 20, .55); display: grid; place-items: center; padding: 16px; }
    .qb-cur .pv .box { width: min(620px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--qb-panel); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 22px 24px; }
    .qb-cur .pv .face { min-height: 180px; display: grid; align-content: center; gap: 10px; text-align: center; padding: 18px 6px; }
    .qb-cur .pv .face .qq { font-family: var(--qb-serif); font-size: 1.5rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
    .qb-cur .pv .face .aa { font-size: 1.15rem; font-weight: 600; color: var(--qb-good); overflow-wrap: anywhere; }
    .qb-cur .pv .face .ee { color: var(--qb-muted); overflow-wrap: anywhere; }
    @media (max-width: 620px) {
      .qb-cur .crd { grid-template-columns: 2em minmax(0, 1fr); }
      .qb-cur .crd .acts { grid-column: 2; grid-row: auto; }
      .qb-cur .edit .grid2 { grid-template-columns: 1fr; }
      .qb-cur .tog { min-width: 0; flex-basis: 100%; }
    }
    </style>
    <script>
    (function () {
      var QB = window.QB;
      // Hands the browser a file to save. Tests replace QB.saveFile to check what would be downloaded.
      QB.saveFile = QB.saveFile || function (name, text) {
        var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        var a = document.createElement('a');
        a.href = url; a.download = name; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      };

      QB.define('curriculum', function (root, data, emit) {
        var esc = QB.esc;
        var S = { mods: data.modules || [], colors: data.colors || [], open: {}, openPart: {}, cards: {},
                  edit: null, busy: false, filter: '', pv: null };

        function pad(n) { return String(n || 0).padStart(2, '0'); }
        function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
        function findMod(id) { return S.mods.filter(function (m) { return m.id === id; })[0]; }
        function findPart(id) {
          for (var i = 0; i < S.mods.length; i++) {
            var p = S.mods[i].parts.filter(function (x) { return x.id === id; })[0];
            if (p) return { mod: S.mods[i], part: p };
          }
          return null;
        }
        function isEditing(kind, id) { return S.edit && S.edit.kind === kind && S.edit.id === id; }
        function totals() {
          return S.mods.reduce(function (a, m) { a.parts += m.parts.length; a.cards += m.card_count; return a; }, { parts: 0, cards: 0 });
        }

        function render() {
          var t = totals();
          root.innerHTML = '<div class="wrap qb-cur fade-in">' +
            '<div class="crumbs"><button data-action="back">← Profile</button></div>' +
            '<div class="head"><div><div class="kind">Admin</div><h1>Manage curriculum</h1>' +
              '<div class="muted small" data-el="totals">' + plural(S.mods.length, 'module') + ' · ' + plural(t.parts, 'part') + ' · ' + plural(t.cards, 'card') + '</div></div>' +
              '<span class="spacer"></span><button class="btn" data-action="export_all">Download all (JSON)</button></div>' +
            '<p class="muted small" style="margin:0 0 14px;max-width:70ch">Changes go live for learners straight away. Editing a card keeps everyone\'s progress on it; deleting removes the card and everyone\'s progress on it. Hidden modules and parts stay here but learners can\'t see them. A downloaded file can be imported again from your profile.</p>' +
            '<div class="tools"><input type="text" data-el="filter" placeholder="Filter by module or part title…" value="' + esc(S.filter) + '" aria-label="Filter modules"></div>' +
            '<div class="list" data-el="list"></div>' +
            '</div>' + (S.pv ? pvHtml() : '');
          root.querySelector('[data-el=filter]').oninput = function (e) { S.filter = e.target.value; renderList(); };
          renderList();
        }

        function renderList() {
          var t = totals();
          var tot = root.querySelector('[data-el=totals]');
          if (tot) tot.textContent = plural(S.mods.length, 'module') + ' · ' + plural(t.parts, 'part') + ' · ' + plural(t.cards, 'card');
          var f = S.filter.trim().toLowerCase();
          var mods = S.mods.filter(function (m) {
            if (!f) return true;
            return (pad(m.number) + ' ' + m.title).toLowerCase().indexOf(f) >= 0 ||
              m.parts.some(function (p) { return p.title.toLowerCase().indexOf(f) >= 0; });
          });
          root.querySelector('[data-el=list]').innerHTML = mods.length ? mods.map(modHtml).join('') :
            '<div class="empty">' + (S.mods.length ? 'No module matches that filter.' : 'No modules yet. Import module files from your profile.') + '</div>';
        }

        function hiddenBadge(item) { return item.published ? '' : '<span class="badge warn">Hidden</span>'; }

        function modHtml(m) {
          var open = !!S.open[m.id];
          return '<article class="card mod" data-mod="' + esc(m.id) + '" style="--c:' + esc(m.color) + '">' +
            '<div class="mhead"><button class="tog" data-action="toggle_mod" data-id="' + esc(m.id) + '" aria-expanded="' + open + '">' +
              '<span class="chev">▶</span><span class="num">' + pad(m.number) + '</span>' +
              '<span class="t">' + esc(m.title) + '<span class="sub">' + plural(m.parts.length, 'part') + ' · ' + plural(m.card_count, 'card') + '</span></span></button>' +
              hiddenBadge(m) +
              '<div class="acts"><button class="btn sm" data-action="edit_mod" data-id="' + esc(m.id) + '">Edit</button>' +
                '<button class="btn sm" data-action="export_mod" data-id="' + esc(m.id) + '">Download JSON</button>' +
                '<button class="btn sm danger" data-action="del_mod" data-id="' + esc(m.id) + '">Delete</button></div></div>' +
            (isEditing('module', m.id) ? '<div class="body">' + modForm(m) + '</div>' : '') +
            (open ? '<div class="body">' +
              (m.description ? '<p class="muted small" style="margin:0">' + esc(m.description) + '</p>' : '') +
              (m.parts.length ? m.parts.map(partHtml).join('') : '<p class="muted small">This module has no parts.</p>') +
              (m.published ? '<div><button class="btn ghost sm" data-action="view_mod" data-id="' + esc(m.id) + '">View as a learner →</button></div>' : '') +
            '</div>' : '') +
          '</article>';
        }

        function partHtml(p) {
          var open = !!S.openPart[p.id];
          return '<div class="part" data-part="' + esc(p.id) + '">' +
            '<div class="phead"><button class="tog" data-action="toggle_part" data-id="' + esc(p.id) + '" aria-expanded="' + open + '">' +
              '<span class="chev">▶</span><span class="num">' + esc(p.number) + '</span>' +
              '<span class="t">' + esc(p.title) + '<span class="sub">' + plural(p.card_count, 'card') + '</span></span></button>' +
              hiddenBadge(p) +
              '<div class="acts"><button class="btn sm" data-action="preview" data-id="' + esc(p.id) + '"' + (p.card_count ? '' : ' disabled') + '>Preview</button>' +
                '<button class="btn sm" data-action="edit_part" data-id="' + esc(p.id) + '">Edit</button>' +
                '<button class="btn sm danger" data-action="del_part" data-id="' + esc(p.id) + '">Delete</button></div></div>' +
            (isEditing('part', p.id) ? '<div class="pbody">' + partForm(p) + '</div>' : '') +
            (open ? '<div class="pbody">' + cardsHtml(p) + '</div>' : '') +
          '</div>';
        }

        function cardsHtml(p) {
          var cs = S.cards[p.id];
          if (cs === 'loading' || cs === undefined) return '<p class="muted small"><span class="spin"></span> Loading cards…</p>';
          if (cs.error) return '<div class="feedback bad">' + esc(cs.error) + '</div>';
          var adding = isEditing('card', null) && S.edit.quiz === p.id;
          return (p.description ? '<p class="muted small" style="margin:0 0 10px">' + esc(p.description) + '</p>' : '') +
            (cs.length ? '<ol class="cards">' + cs.map(function (c, i) {
              if (isEditing('card', c.id)) return '<li>' + cardForm(c, p.id) + '</li>';
              return '<li class="crd" data-card="' + esc(c.id) + '"><span class="n">' + (i + 1) + '</span>' +
                '<div class="q">' + esc(c.question) + '</div>' +
                '<div class="acts"><button class="btn sm" data-action="edit_card" data-id="' + esc(c.id) + '" data-part="' + esc(p.id) + '">Edit</button>' +
                  '<button class="btn sm danger" data-action="del_card" data-id="' + esc(c.id) + '" data-part="' + esc(p.id) + '">Delete</button></div>' +
                '<div class="a" style="grid-column:2">' + esc(c.answer) + '</div>' +
                (c.explanation || c.concept ? '<div class="e" style="grid-column:2">' + esc(c.explanation) +
                  (c.concept ? ' <span class="badge">' + esc(c.concept) + '</span>' : '') + '</div>' : '') +
              '</li>';
            }).join('') + '</ol>' : '<p class="muted small">No cards in this part yet.</p>') +
            (adding ? '<div style="margin-top:8px">' + cardForm({}, p.id) + '</div>' :
              '<div style="margin-top:10px"><button class="btn sm" data-action="add_card" data-part="' + esc(p.id) + '">+ Add a card</button></div>');
        }

        function field(label, name, value, opts) {
          opts = opts || {};
          var id = 'qbCur' + name + Math.random().toString(36).slice(2, 7);
          var input = opts.area ? '<textarea id="' + id + '" name="' + name + '"' + (opts.required ? ' required' : '') + '>' + esc(value || '') + '</textarea>' :
            '<input type="' + (opts.type || 'text') + '" id="' + id + '" name="' + name + '" value="' + esc(value == null ? '' : value) + '"' +
              (opts.required ? ' required' : '') + (opts.type === 'number' ? ' min="0" max="9999" step="1"' : '') + '>';
          return '<div><label class="f" for="' + id + '">' + label + '</label>' + input + (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
        }
        function shown(item) {
          return '<label class="toggle"><input type="checkbox" name="published"' + (item.published ? ' checked' : '') + '><span>Visible to learners</span></label>';
        }
        function formEnd(saveLabel) {
          return '<div class="err" data-el="err"></div><div class="row"><span class="spacer"></span>' +
            '<button type="button" class="btn" data-action="cancel">Cancel</button>' +
            '<button type="submit" class="btn primary">' + saveLabel + '</button></div>';
        }

        function modForm(m) {
          return '<form class="edit" data-form="module" data-id="' + esc(m.id) + '"><h3 style="margin:0">Edit module</h3>' +
            '<div class="grid2">' + field('Number', 'number', m.number, { type: 'number', required: true, hint: 'Its place in the learning path.' }) +
              '<div><label class="f">Colour</label><div class="row"><input type="color" name="color" value="' + esc(m.color) + '" aria-label="Module colour">' +
              '<span class="muted small">Used for its number and progress bars.</span></div></div></div>' +
            field('Title', 'title', m.title, { required: true, hint: 'Importing a file matches modules by title, so renaming means a later import of the old file creates a new module.' }) +
            field('Description', 'description', m.description, { area: true }) +
            shown(m) + formEnd('Save module') + '</form>';
        }

        function partForm(p) {
          return '<form class="edit" data-form="part" data-id="' + esc(p.id) + '"><h3 style="margin:0">Edit part</h3>' +
            '<div class="grid2">' + field('Number', 'number', p.number, { type: 'number', required: true, hint: 'Its order within the module.' }) +
              field('Source link', 'source', p.source === 'import' ? '' : p.source, { hint: 'Shown to learners as the source.' }) + '</div>' +
            field('Title', 'title', p.title, { required: true }) +
            field('Description', 'description', p.description, { area: true }) +
            shown(p) + formEnd('Save part') + '</form>';
        }

        function cardForm(c, partId) {
          return '<form class="edit" data-form="card" data-id="' + esc(c.id || '') + '" data-part="' + esc(partId) + '"><h3 style="margin:0">' + (c.id ? 'Edit card' : 'New card') + '</h3>' +
            field('Question', 'question', c.question, { area: true, required: true }) +
            field('Answer', 'answer', c.answer, { area: true, required: true, hint: 'Keep it short: the learner checks their own recall against it.' }) +
            field('Explanation <span class="muted">(optional)</span>', 'explanation', c.explanation, { area: true }) +
            field('Concept <span class="muted">(optional)</span>', 'concept', c.concept) +
            formEnd(c.id ? 'Save card' : 'Add card') + '</form>';
        }

        // ---- flashcard preview (nothing is recorded)
        function pvHtml() {
          var cs = S.cards[S.pv.part] || [], c = cs[S.pv.i] || {}, info = findPart(S.pv.part) || { part: {} };
          return '<div class="pv" data-action="pv_close" role="dialog" aria-modal="true" aria-label="Card preview"><div class="box" data-el="pvbox">' +
            '<div class="row small"><span class="muted">' + esc(info.part.title) + '</span><span class="spacer"></span><span class="badge">' + (S.pv.i + 1) + ' / ' + cs.length + '</span></div>' +
            '<div class="face">' + (c.concept ? '<div class="kind">' + esc(c.concept) + '</div>' : '') +
              '<div class="qq">' + esc(c.question) + '</div>' +
              (S.pv.flip ? '<div class="aa">' + esc(c.answer) + '</div>' + (c.explanation ? '<div class="ee">' + esc(c.explanation) + '</div>' : '') : '') + '</div>' +
            '<div class="row"><button class="btn" data-action="pv_prev"' + (S.pv.i ? '' : ' disabled') + '>← Previous</button><span class="spacer"></span>' +
              (S.pv.flip ? '' : '<button class="btn primary" data-action="pv_flip">Show answer</button>') +
              '<button class="btn" data-action="pv_next"' + (S.pv.i < cs.length - 1 ? '' : ' disabled') + '>Next →</button>' +
              '<button class="btn ghost" data-action="pv_close">Close</button></div>' +
            '<p class="muted small" style="margin:10px 0 0">Preview only: nothing is recorded. Keys: space shows the answer, ← → move, Esc closes.</p>' +
          '</div></div>';
        }
        function renderPv() {
          var old = root.querySelector('.pv');
          if (old) old.remove();
          if (S.pv) root.querySelector('.qb-cur').insertAdjacentHTML('beforeend', pvHtml());
        }
        function pvMove(d) {
          var n = (S.cards[S.pv.part] || []).length;
          var i = Math.max(0, Math.min(n - 1, S.pv.i + d));
          if (i !== S.pv.i) { S.pv.i = i; S.pv.flip = false; renderPv(); }
        }
        function onKey(e) {
          if (!document.body.contains(root)) { document.removeEventListener('keydown', onKey); return; }
          if (!S.pv) return;
          if (e.key === 'Escape') { S.pv = null; renderPv(); }
          else if (e.key === 'ArrowRight') pvMove(1);
          else if (e.key === 'ArrowLeft') pvMove(-1);
          else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!S.pv.flip) { S.pv.flip = true; renderPv(); } else pvMove(1); }
        }
        document.addEventListener('keydown', onKey);

        // ---- server calls
        function fail(err) { QB.toast(String(err && err.message || err || 'Something went wrong'), true); }

        function loadPart(id) {
          S.cards[id] = 'loading';
          return emit('load_part', { id: id }).then(function (res) {
            S.cards[id] = res && res.ok ? res.cards : { error: (res && res.error) || 'Could not load the cards.' };
          }, function (err) { S.cards[id] = { error: String(err && err.message || err) }; });
        }

        function exportJson(id, btn) {
          btn.disabled = true;
          var label = btn.innerHTML;
          btn.innerHTML = '<span class="spin"></span> Preparing';
          emit('export', { id: id || null }).then(function (res) {
            btn.disabled = false; btn.innerHTML = label;
            if (!res || !res.ok) return fail(res && res.error);
            var items = res.items || [];
            QB.saveFile(res.filename, JSON.stringify(items, null, 1));
            var n = items.reduce(function (a, it) { return a + (it.questions || []).length; }, 0);
            QB.toast('Downloaded ' + res.filename + ' (' + plural(items.length, 'part') + ', ' + plural(n, 'card') + ')');
          }, function (err) { btn.disabled = false; btn.innerHTML = label; fail(err); });
        }

        function remove(kind, id, btn) {
          var msg;
          if (kind === 'module') {
            var m = findMod(id);
            msg = 'Delete module ' + pad(m.number) + ' · ' + m.title + '?\n\nThis removes its ' + plural(m.parts.length, 'part') + ' and ' + plural(m.card_count, 'card') +
              ', and every learner\'s progress on them. It can\'t be undone.\n\nTip: cancel and use "Download JSON" first to keep a copy.';
          } else if (kind === 'part') {
            var p = findPart(id).part;
            msg = 'Delete the part "' + p.title + '"?\n\nThis removes its ' + plural(p.card_count, 'card') + ' and every learner\'s progress on them. It can\'t be undone.';
          } else {
            msg = 'Delete this card?\n\nEvery learner\'s progress on it is removed too. It can\'t be undone.';
          }
          if (!window.confirm(msg)) return;
          btn.disabled = true;
          emit('delete', { kind: kind, id: id }).then(function (res) {
            if (!res || !res.ok) { btn.disabled = false; return fail(res && res.error); }
            if (kind === 'module') S.mods = S.mods.filter(function (x) { return x.id !== id; });
            else if (kind === 'part') { var f = findPart(id); f.mod.parts = f.mod.parts.filter(function (x) { return x.id !== id; }); f.mod.card_count -= f.part.card_count; delete S.cards[id]; }
            else {
              var pid = btn.dataset.part, info = findPart(pid);
              S.cards[pid] = S.cards[pid].filter(function (c) { return c.id !== id; });
              info.mod.card_count += res.card_count - info.part.card_count; info.part.card_count = res.card_count;
            }
            if (S.edit && S.edit.id === id) S.edit = null;
            renderList();
            QB.toast(res.message);
          }, function (err) { btn.disabled = false; fail(err); });
        }

        function submit(form) {
          var kind = form.dataset.form, id = form.dataset.id || null, f = form.elements;
          var fields = {};
          ['number', 'title', 'description', 'color', 'source', 'question', 'answer', 'explanation', 'concept'].forEach(function (k) {
            if (f[k]) fields[k] = f[k].value;
          });
          if (f.published) fields.published = f.published.checked;
          var btn = form.querySelector('button[type=submit]'), label = btn.textContent;
          var errBox = form.querySelector('[data-el=err]');
          btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Saving';
          errBox.textContent = '';
          var event = kind === 'module' ? 'save_module' : kind === 'part' ? 'save_part' : 'save_card';
          var payload = kind === 'card' ? { quiz_id: form.dataset.part, id: id, fields: fields } : { id: id, fields: fields };
          emit(event, payload).then(function (res) {
            if (!res || !res.ok) { btn.disabled = false; btn.textContent = label; errBox.textContent = (res && res.error) || 'Could not save.'; return; }
            if (kind === 'module') {
              var i = S.mods.indexOf(findMod(id));
              S.mods[i] = res.module;
              S.mods.sort(function (a, b) { return (a.number || 0) - (b.number || 0); });
            } else if (kind === 'part') {
              var f1 = findPart(id), j = f1.mod.parts.indexOf(f1.part);
              f1.mod.parts[j] = res.part;
              f1.mod.parts.sort(function (a, b) { return (a.number || 0) - (b.number || 0); });
            } else {
              var pid = form.dataset.part, info = findPart(pid), cs = S.cards[pid];
              if (id) cs[cs.map(function (c) { return c.id; }).indexOf(id)] = res.card; else cs.push(res.card);
              info.mod.card_count += res.card_count - info.part.card_count; info.part.card_count = res.card_count;
            }
            S.edit = null;
            renderList();
            QB.toast(kind === 'card' ? (id ? 'Card saved' : 'Card added') : (kind === 'module' ? 'Module saved' : 'Part saved'));
          }, function (err) { btn.disabled = false; btn.textContent = label; errBox.textContent = String(err && err.message || err); });
        }

        function startEdit(kind, id, extra) {
          S.edit = Object.assign({ kind: kind, id: id }, extra || {});
          renderList();
          var form = root.querySelector('form.edit');
          if (form) { var first = form.querySelector('textarea, input[type=text]'); if (first) first.focus(); form.scrollIntoView({ block: 'nearest' }); }
        }

        root.addEventListener('submit', function (e) {
          var form = e.target.closest('form.edit');
          if (!form) return;
          e.preventDefault();
          submit(form);
        });

        root.addEventListener('click', function (e) {
          var el = e.target.closest('[data-action]');
          if (!el || el.disabled) return;
          var a = el.dataset.action, id = el.dataset.id;
          if (a === 'pv_close' && el.classList.contains('pv') && e.target !== el) return; // clicks inside the card keep it open
          if (a === 'back') emit('back', {});
          else if (a === 'toggle_mod') { S.open[id] = !S.open[id]; renderList(); }
          else if (a === 'toggle_part') {
            S.openPart[id] = !S.openPart[id];
            if (S.openPart[id] && (S.cards[id] === undefined || S.cards[id].error)) loadPart(id).then(renderList);
            renderList();
          }
          else if (a === 'edit_mod') startEdit('module', isEditing('module', id) ? null : id);
          else if (a === 'edit_part') startEdit('part', isEditing('part', id) ? null : id);
          else if (a === 'edit_card') startEdit('card', id);
          else if (a === 'add_card') startEdit('card', null, { quiz: el.dataset.part });
          else if (a === 'cancel') { S.edit = null; renderList(); }
          else if (a === 'del_mod') remove('module', id, el);
          else if (a === 'del_part') remove('part', id, el);
          else if (a === 'del_card') remove('card', id, el);
          else if (a === 'export_mod') exportJson(id, el);
          else if (a === 'export_all') exportJson(null, el);
          else if (a === 'view_mod') emit('open_collection', { id: id });
          else if (a === 'preview') {
            var go = function () { if (Array.isArray(S.cards[id]) && S.cards[id].length) { S.pv = { part: id, i: 0, flip: false }; renderPv(); } else if (S.cards[id] && S.cards[id].error) fail(S.cards[id].error); };
            if (Array.isArray(S.cards[id])) go();
            else { el.disabled = true; loadPart(id).then(function () { el.disabled = false; if (S.openPart[id]) renderList(); go(); }); }
          }
          else if (a === 'pv_flip') { S.pv.flip = true; renderPv(); }
          else if (a === 'pv_next') pvMove(1);
          else if (a === 'pv_prev') pvMove(-1);
          else if (a === 'pv_close') { S.pv = null; renderPv(); }
        });

        render();
        return {};
      });
    })();
    </script>
package_name: CAF_Guide
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {auto_create_missing_columns: false}
